<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>日本語音声聴覚識別調査 / Japanese Speech Perception Study</title>
  <script src="https://unpkg.com/jspsych@7.3.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.0"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" />
  <style>
    :root {
      --ink: #ecf1f8;
      --muted-ink: #bfd0e7;
      --panel: rgba(10, 22, 40, 0.62);
      --panel-border: rgba(181, 206, 240, 0.36);
      --accent: #b7cced;
      --accent-strong: #85abde;
      --focus-ring: rgba(133, 171, 222, 0.45);
      --shadow: 0 22px 50px rgba(1, 7, 18, 0.5);
      --brand-header-space: 64px;
      --brand-footer-space: 44px;
      --ui-font-base: clamp(15px, 0.45vw + 13px, 19px);
      --ui-font-small: clamp(13px, 0.32vw + 11.5px, 16px);
      --ui-font-heading-1: clamp(21px, 1vw + 16px, 34px);
      --ui-font-heading-2: clamp(19px, 0.8vw + 15px, 30px);
      --ui-font-heading-3: clamp(17px, 0.65vw + 14px, 24px);
      --ui-control-height: clamp(46px, 1.35vw + 38px, 58px);
      --ui-content-pad-y: clamp(16px, 1.05vw + 10px, 28px);
      --ui-content-pad-x: clamp(12px, 1.1vw + 7px, 26px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'IBM Plex Sans', 'Noto Sans JP', sans-serif;
      font-size: var(--ui-font-base);
      background: radial-gradient(circle at 12% 8%, rgba(123, 163, 209, 0.24), transparent 45%),
                  radial-gradient(circle at 88% 16%, rgba(150, 190, 233, 0.16), transparent 38%),
                  linear-gradient(135deg, #020a15 0%, #071224 55%, #0b1a30 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('osakabg.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.28;
      filter: saturate(1.14) contrast(1.08) brightness(1.03);
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(4, 11, 23, 0.2), rgba(4, 11, 23, 0.68));
      z-index: -1;
      pointer-events: none;
    }

    .jspsych-display-element,
    .jspsych-content-wrapper {
      background: transparent;
      color: var(--ink);
      font-family: 'IBM Plex Sans', 'Noto Sans JP', sans-serif;
    }

    .jspsych-display-element {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    #jspsych-content {
      margin: 0 auto;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: var(--ui-content-pad-y) var(--ui-content-pad-x);
      max-width: 960px;
      width: min(960px, 100%);
      font-size: var(--ui-font-base);
      line-height: 1.5;
    }

    .jspsych-content-wrapper {
      padding: calc(var(--brand-header-space) + 14px) 12px calc(var(--brand-footer-space) + 24px);
      display: flex;
      justify-content: center;
    }

    h1, h2, h3 {
      letter-spacing: 0.02em;
    }

    #jspsych-content h1 {
      font-size: var(--ui-font-heading-1);
      line-height: 1.32;
    }

    #jspsych-content h2 {
      font-size: var(--ui-font-heading-2);
      line-height: 1.35;
    }

    #jspsych-content h3 {
      font-size: var(--ui-font-heading-3);
      line-height: 1.36;
    }

    #jspsych-content p,
    #jspsych-content li,
    #jspsych-content label,
    #jspsych-content span,
    #jspsych-content div {
      font-size: var(--ui-font-base);
      line-height: 1.5;
    }

    .jspsych-btn {
      background: linear-gradient(180deg, #2a4f80, #1b3457);
      color: #f7fbff;
      border: 1px solid #93b7e4;
      border-radius: 8px;
      font-weight: 600;
      padding: 9px 18px;
      transition: transform 120ms ease, box-shadow 160ms ease, background 160ms ease;
      box-shadow: 0 10px 22px rgba(6, 17, 34, 0.44);

    .jspsych-btn:hover {
      transform: translateY(-1px);
      background: linear-gradient(180deg, #316094, #224169);
      box-shadow: 0 12px 24px rgba(7, 20, 40, 0.52);
    }

    button:not(.jspsych-btn) {
      color: #f7fbff !important;
      border-color: rgba(150, 184, 226, 0.82) !important;
      background: linear-gradient(180deg, rgba(39, 70, 109, 0.92), rgba(26, 47, 76, 0.92)) !important;
      box-shadow: 0 8px 18px rgba(6, 17, 34, 0.34);
    }

    button:not(.jspsych-btn):hover {
      background: linear-gradient(180deg, rgba(51, 89, 137, 0.94), rgba(32, 59, 93, 0.94)) !important;
    }

    .jspsych-btn:focus-visible,
    button:focus-visible,
    select:focus-visible,

    #jspsych-content .jspsych-btn,
    #jspsych-content button:not(.jspsych-btn) {

    #jspsych-content select,
    #jspsych-content input[type="text"],

    #jspsych-content [style*="font-size: 64px"] {

    #jspsych-content [style*="font-size: 24px"] {

      border-color: rgba(166, 197, 236, 0.3) !important;

    }

      position: fixed;
      top: 8px;
      left: 50%;

    #ouFooter {

      border-radius: 10px;
      border: 1px solid rgba(183, 209, 243, 0.24);
      background: rgba(7, 18, 35, 0.62);
      backdrop-filter: blur(7px);
      color: #ffffff;
      text-align: left;
      line-height: 1.2;
      font-size: 0.62rem;

    #ouFooter .footer-layout {

    }

    #ouFooter .footer-text {

    #ouFooter .footer-logo {

      box-shadow: 0 4px 10px rgba(6, 17, 34, 0.28);

    }

    @media (max-width: 760px) {
      html {
        -webkit-text-size-adjust: 100%;

      :root {
        --ui-font-base: clamp(15px, 1.05vw + 11px, 18px);
        --ui-font-small: clamp(13px, 0.75vw + 10.5px, 15px);
        --ui-control-height: clamp(50px, 1.7vw + 44px, 58px);
      }

      #jspsych-content {
        border-radius: 12px;
        padding: 20px 14px;
        width: min(100%, calc(100vw - 16px));
      }

      #jspsych-content,
      #jspsych-content p,
      #jspsych-content li,
      #jspsych-content label,
      #jspsych-content span,
      #jspsych-content div {
        font-size: var(--ui-font-base) !important;
        line-height: 1.5 !important;
      }

      #jspsych-content h1 {
        font-size: var(--ui-font-heading-1) !important;
        line-height: 1.35 !important;
      }

      #jspsych-content h2 {
        font-size: var(--ui-font-heading-2) !important;
        line-height: 1.35 !important;
      }

      #jspsych-content h3 {
        font-size: var(--ui-font-heading-3) !important;
        line-height: 1.35 !important;
      }

      #jspsych-content .jspsych-btn,
      #jspsych-content button:not(.jspsych-btn) {
        min-height: var(--ui-control-height) !important;
        font-size: var(--ui-font-base) !important;
        line-height: 1.25 !important;
        padding: clamp(10px, 1vw + 8px, 14px) clamp(12px, 1.2vw + 8px, 16px) !important;
      }

      #jspsych-content .jspsych-html-button-response-button {
        margin: 6px !important;
      }

      #jspsych-content select,
      #jspsych-content input[type="text"],
      #jspsych-content input[type="email"],
      #jspsych-content textarea {
        min-height: var(--ui-control-height) !important;
        font-size: var(--ui-font-base) !important;
        padding: clamp(10px, 0.9vw + 8px, 12px) clamp(10px, 1vw + 7px, 12px) !important;
      }

      #jspsych-content select,
      #jspsych-content textarea {
        width: 100% !important;
        max-width: 100% !important;
      }

      #jspsych-content [id$="Btn"],
      #jspsych-content [id$="_btn"],
      #jspsych-content [id*="_next"],
      #jspsych-content [id*="_back"] {

        max-width: 100% !important;
      }

      .jspsych-content-wrapper {
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
      }

      #ouBrandHeader {
        position: relative;

      #ouFooter .footer-layout {

      }

      #ouFooter .footer-line {

    @media (min-width: 761px) and (max-width: 1100px) {
      :root {
        --ui-font-base: clamp(16px, 0.75vw + 12px, 19px);
        --ui-font-small: clamp(13px, 0.55vw + 10px, 16px);
        --ui-control-height: clamp(48px, 1.2vw + 40px, 56px);
      }

      #jspsych-content {
        max-width: min(960px, calc(100vw - 24px));

  </style>

<body></body>
<script>
  function mountBrandHeader() {
    if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) return;
    if (document.getElementById('ouBrandHeader')) return;

    const header = document.createElement('div');
    header.id = 'ouBrandHeader';
    header.innerHTML = `
      <img src="ou_logo.png" alt="Osaka University logo" />
      <div class="brand-text">
        <div class="brand-ja">大阪大学大学院 人文学研究科</div>
        <div class="brand-en">Osaka University Graduate School of Humanities</div>
      </div>
    `;
    document.body.appendChild(header);
  }

  function mountTopCredit() {
    if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) return;
    if (document.getElementById('ouTopCredit')) return;

    const credit = document.createElement('div');
    credit.id = 'ouTopCredit';
    credit.textContent = 'Perception Test Module Developed by : KEHANAN Akarapong';
    document.body.appendChild(credit);
  }

  mountBrandHeader();

  function mountFooter() {
    if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) return;
    if (document.getElementById('ouFooter')) return;

    const footer = document.createElement('div');
    footer.id = 'ouFooter';
    footer.innerHTML = `
      <div class="footer-layout">
        <div class="footer-text">
          <p class="footer-line"><strong>日本語学習者におけるイ段音（単音／拗音）の口蓋化子音の聴取困難</strong> / Perceptual difficulty of palatalized consonants in i-row sounds | <strong>Email:</strong> u548378a@ecs.osaka-u.ac.jp</p>
        </div>
        <img class="footer-logo" src="ou_logo.png" alt="Osaka University logo" />
      </div>
    `;
    document.body.appendChild(footer);
  }

  function ensurePersistentBranding() {
    mountTopCredit();
    mountBrandHeader();
    mountFooter();
    syncBrandingLayoutSpacing();
  }

  function syncBrandingLayoutSpacing() {
    const root = document.documentElement;
    const header = document.getElementById('ouBrandHeader');
    const footer = document.getElementById('ouFooter');
    const isMobile = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;

    const headerHeight = isMobile
      ? 12
      : header
      ? Math.ceil(header.getBoundingClientRect().height) + 18
      : 88;
    const footerHeight = isMobile
      ? 12
      : footer
      ? Math.ceil(footer.getBoundingClientRect().height) + 18
      : 92;

    root.style.setProperty('--brand-header-space', `${headerHeight}px`);
    root.style.setProperty('--brand-footer-space', `${footerHeight}px`);
  }

  let brandingLayoutSyncStarted = false;
  function startBrandingLayoutSync() {
    if (brandingLayoutSyncStarted) return;
    brandingLayoutSyncStarted = true;

    window.addEventListener('resize', syncBrandingLayoutSpacing);
    window.addEventListener('orientationchange', syncBrandingLayoutSpacing);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncBrandingLayoutSpacing);
    }

    if (window.ResizeObserver) {
      const resizeObserver = new ResizeObserver(function() {
        syncBrandingLayoutSpacing();
      });

      const tryObserve = () => {
        const header = document.getElementById('ouBrandHeader');
        const footer = document.getElementById('ouFooter');
        if (header) resizeObserver.observe(header);
        if (footer) resizeObserver.observe(footer);
      };

      tryObserve();
      setTimeout(tryObserve, 0);
    }

    syncBrandingLayoutSpacing();
  }

  let brandingObserverStarted = false;
  function startBrandingObserver() {
    if (brandingObserverStarted || !document.body) return;
    brandingObserverStarted = true;

    const observer = new MutationObserver(function() {
      const isMobile = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
      const missingDesktopBranding = !isMobile && (
        !document.getElementById('ouTopCredit') ||
        !document.getElementById('ouBrandHeader') ||
        !document.getElementById('ouFooter')
      );

      if (missingDesktopBranding) {
        ensurePersistentBranding();
      }
      syncBrandingLayoutSpacing();
    });

    observer.observe(document.body, { childList: true });
  }

  ensurePersistentBranding();
  startBrandingObserver();
  startBrandingLayoutSync();

  // ========================================
  // Mapping: stimulus (kana) -> audio filename (romaji, no extension)
  // ========================================
  const stimulusToRomaji = {
    'し':'shi', 'ち':'chi', 'ひ':'hi', 'に':'ni', 'ぎ':'gi', 'じ':'ji', 'き':'ki', 'り':'ri', 'み':'mi', 'び':'bi', 'ぴ':'pi',
    'きゃ':'kya', 'きゅ':'kyu', 'きょ':'kyo',
    'ぎゃ':'gya', 'ぎゅ':'gyu', 'ぎょ':'gyo',
    'しゃ':'sha', 'しゅ':'shu', 'しょ':'sho',
    'じゃ':'ja', 'じゅ':'ju', 'じょ':'jo',
    'ちゃ':'cha', 'ちゅ':'chu', 'ちょ':'cho',
    'にゃ':'nya', 'にゅ':'nyu', 'にょ':'nyo',
    'ひゃ':'hya', 'ひゅ':'hyu', 'ひょ':'hyo',
    'ぴゃ':'pya', 'ぴゅ':'pyu', 'ぴょ':'pyo',
    'びゃ':'bya', 'びゅ':'byu', 'びょ':'byo',
    'みゃ':'mya', 'みゅ':'myu', 'みょ':'myo',
    'りゃ':'rya', 'りゅ':'ryu', 'りょ':'ryo',
    'か':'ka', 'た':'ta'
  };

  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYHlkCLsRIJifCDTMFdmLwXyz9PC31ReUz-RxWbasI3ywEVrn_LF9AKzWx-5bp6sXi0Q/exec';
  const PENDING_SUBMISSIONS_KEY = 'palatalizedsoundtest_pending_submissions';
  const PRE_SURVEY_CACHE_KEY = 'palatalizedsoundtest_pre_survey_cache';
  let confirmedPreSurveyData = null;

  function savePreSurveyCache(data) {
    confirmedPreSurveyData = data && typeof data === 'object' ? { ...data } : null;
    try {
      if (confirmedPreSurveyData) {
        sessionStorage.setItem(PRE_SURVEY_CACHE_KEY, JSON.stringify(confirmedPreSurveyData));
      }
    } catch (error) {
      console.warn('Unable to persist pre-survey cache:', error);
    }
  }

  function loadPreSurveyCache() {
    if (confirmedPreSurveyData && typeof confirmedPreSurveyData === 'object') {
      return confirmedPreSurveyData;
    }

    try {
      const raw = sessionStorage.getItem(PRE_SURVEY_CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        confirmedPreSurveyData = parsed;
        return confirmedPreSurveyData;
      }
    } catch (error) {
      console.warn('Unable to read pre-survey cache:', error);
    }

    return null;
  }

  function createSubmissionId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }

    return 'submission-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function readPendingSubmissions() {
    try {
      const raw = localStorage.getItem(PENDING_SUBMISSIONS_KEY);
      if (!raw) return [];

      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      console.error('Unable to read pending submissions:', error);
      return [];
    }
  }

  function writePendingSubmissions(items) {
    try {
      localStorage.setItem(PENDING_SUBMISSIONS_KEY, JSON.stringify(items));
    } catch (error) {
      console.error('Unable to persist pending submissions:', error);
    }
  }

  function queueSubmission(payload) {
    const items = readPendingSubmissions();
    const existingIndex = items.findIndex(item => item.submissionId === payload.submission_id);
    const entry = {
      submissionId: payload.submission_id,
      payload,
      queuedAt: new Date().toISOString(),
      attempts: existingIndex >= 0 ? items[existingIndex].attempts || 0 : 0,
      lastError: existingIndex >= 0 ? items[existingIndex].lastError || '' : ''
    };

    if (existingIndex >= 0) {
      items[existingIndex] = entry;
    } else {
      items.push(entry);
    }

    writePendingSubmissions(items);
  }

  function updateQueuedSubmission(submissionId, updates) {
    const items = readPendingSubmissions();
    const index = items.findIndex(item => item.submissionId === submissionId);
    if (index === -1) return;

    items[index] = {
      ...items[index],
      ...updates
    };
    writePendingSubmissions(items);
  }

  function removeQueuedSubmission(submissionId) {
    const items = readPendingSubmissions().filter(item => item.submissionId !== submissionId);
    writePendingSubmissions(items);
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function postSubmission(payload) {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload),
      keepalive: true
    });

    const responseText = await response.text();
    let result = null;

    if (responseText) {
      try {
        result = JSON.parse(responseText);
      } catch (parseError) {
        // Some mobile browsers cannot read cross-origin JSON body reliably.
        // If HTTP status is success, treat this as delivered and continue.
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText} | Invalid response body: ${responseText}`);
        }

        result = {
          success: true,
          fallback: 'non_json_success_response'
        };
      }
    }

    if (!response.ok) {
      throw new Error(`HTTP ${response.status} ${response.statusText} | ${(result && result.error) || responseText || 'Request failed'}`);
    }

    if (result && result.success === false) {
      throw new Error(result.error || 'Google Apps Script returned success=false');
    }

    if (!result) {
      result = { success: true, fallback: 'empty_success_response' };
    }

    return { response, result, responseText };
  }

  async function postSubmissionFallback(payload) {
    const bodyText = JSON.stringify(payload);

    if (navigator.sendBeacon) {
      const beaconBody = new Blob([bodyText], { type: 'text/plain;charset=utf-8' });
      const accepted = navigator.sendBeacon(GOOGLE_SCRIPT_URL, beaconBody);
      if (accepted) {
        return {
          response: { status: 0, statusText: 'sendBeacon accepted' },
          result: { success: true, fallback: 'sendBeacon' },
          responseText: ''
        };
      }
    }

    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: bodyText,
      keepalive: true
    });

    return {
      response: { status: 0, statusText: 'no-cors' },
      result: { success: true, fallback: 'no-cors' },
      responseText: ''
    };
  }

  async function submitWithRetry(payload, maxAttempts, retryDelayMs) {
    let attempt = 0;
    let lastError = null;

    while (attempt < maxAttempts) {
      attempt += 1;
      updateQueuedSubmission(payload.submission_id, {
        attempts: attempt,
        lastError: ''
      });

      try {
        return await postSubmission(payload);
      } catch (error) {
        lastError = error;

        const isLastAttempt = attempt >= maxAttempts;
        const isFetchNetworkError = error && error.message && error.message.toLowerCase().indexOf('failed to fetch') !== -1;

        if (isLastAttempt && isFetchNetworkError) {
          try {
            const fallbackResult = await postSubmissionFallback(payload);
            updateQueuedSubmission(payload.submission_id, {
              attempts: attempt,
              lastError: '',
              lastAttemptAt: new Date().toISOString(),
              fallbackUsed: fallbackResult.result.fallback
            });
            return fallbackResult;
          } catch (fallbackError) {
            lastError = fallbackError;
          }
        }

        updateQueuedSubmission(payload.submission_id, {
          attempts: attempt,
          lastError: (lastError && lastError.message) ? lastError.message : String(lastError || error),
          lastAttemptAt: new Date().toISOString()
        });

        if (attempt < maxAttempts) {
          await delay(retryDelayMs);
        }
      }
    }

    throw lastError || new Error('Submission failed');
  }

  async function flushPendingSubmissions() {

          submissionId: entry.submissionId,
          status: result.response.status,
          result: result.result
        });
        removeQueuedSubmission(entry.submissionId);
      } catch (error) {
        console.error('Pending submission still failing:', entry.submissionId, error);
      }
    }
  }

      buttonGroup.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
      buttonGroup.style.gap = '10px 12px';
      buttonGroup.style.maxWidth = '760px';
      buttonGroup.style.width = '100%';
      buttonGroup.style.margin = '12px auto 0';

      const otherInlineContainer = document.createElement('div');
      otherInlineContainer.id = 'inline-other-container';
      otherInlineContainer.style.display = 'none';
      otherInlineContainer.style.marginTop = '16px';
      otherInlineContainer.style.padding = '14px';
      otherInlineContainer.style.border = '1px solid rgba(255, 204, 0, 0.38)';
      otherInlineContainer.style.borderRadius = '8px';
      otherInlineContainer.style.background = 'rgba(255, 204, 0, 0.08)';
      otherInlineContainer.style.maxWidth = '760px';
      otherInlineContainer.style.marginLeft = 'auto';
      otherInlineContainer.style.marginRight = 'auto';
      otherInlineContainer.innerHTML = `
        <div style="margin-bottom: 10px; line-height: 1.6; text-align: left;">
          <strong>Please enter the sound you heard in romaji.</strong><br>
          <span style="display:block; margin-top:6px;"><strong>聞こえた音をローマ字で入力してください。</strong></span>
          <span style="display:block; margin-top:8px; color:#d9e6ff; font-size:0.95em;">e.g., di, ti, fi, ri</span>
          <span style="display:block; color:#d9e6ff; font-size:0.95em;">例：di, ti, fi, ri など</span>
        </div>
        <input id="inline_other_input" type="text" placeholder="Enter romaji / ローマ字を入力" style="width:100%; max-width:100%;" aria-label="Other response in romaji" />
        <button type="button" id="inline_other_submit" class="jspsych-btn" style="margin-top:10px; width:100%;">Submit other answer / この回答で送信</button>
        <div id="inline_other_error" style="display:none; margin-top:8px; color:#ff8b8b; text-align:left;">Please enter a response before submitting. / 入力してから送信してください。</div>
      `;

      buttonGroup.insertAdjacentElement('afterend', otherInlineContainer);

      const inlineOtherInput = document.getElementById('inline_other_input');
      const inlineOtherSubmit = document.getElementById('inline_other_submit');
      const inlineOtherError = document.getElementById('inline_other_error');

      let inlineOtherChoiceIndex = -1;
      let inlineOtherSubmitted = false;

      Array.from(buttonGroup.children).forEach((choiceWrapper) => {
        const button = choiceWrapper.querySelector('button.jspsych-btn');
        if (!button) {
          return;
        }

        choiceWrapper.style.margin = '0';
        choiceWrapper.style.width = '100%';

        button.style.width = '100%';
        button.style.minWidth = '0';
        button.style.minHeight = '52px';
        button.style.margin = '0';
        button.style.padding = '10px 8px';
        button.style.whiteSpace = 'normal';
        button.style.lineHeight = '1.3';

        if ((button.textContent || '').includes('他')) {
          choiceWrapper.style.gridColumn = '1 / -1';
          choiceWrapper.style.marginTop = '10px';
          inlineOtherChoiceIndex = Array.from(buttonGroup.children).indexOf(choiceWrapper);

          button.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            event.stopPropagation();

            if (otherInlineContainer.style.display === 'none') {
              otherInlineContainer.style.display = 'block';
            }

            if (inlineOtherError) {
              inlineOtherError.style.display = 'none';
            }

            if (inlineOtherInput) {
              inlineOtherInput.focus();
            }
          }, true);
        }
      });

      if (inlineOtherSubmit) {
        inlineOtherSubmit.addEventListener('click', function() {
          if (inlineOtherSubmitted) {
            return;
          }

          const value = inlineOtherInput ? inlineOtherInput.value.trim() : '';
          if (!value) {
            if (inlineOtherError) {
              inlineOtherError.style.display = 'block';
            }
            if (inlineOtherInput) {
              inlineOtherInput.focus();
            }
            return;
          }

          if (inlineOtherError) {
            inlineOtherError.style.display = 'none';
          }

          inlineOtherSubmitted = true;
          const manualRt = Math.round(performance.now() - trialStartTime);
          jsPsych.finishTrial({
            response: inlineOtherChoiceIndex,
            other_sound: value,
            rt: manualRt
          });
        });
      }
    },
    data: {
      stimulus: jsPsych.timelineVariable('stimulus'),
      correct_response: jsPsych.timelineVariable('correct_response'),
      task: jsPsych.timelineVariable('task')
    },
    on_start: function(trial) {
      if (!trial.data) {
        trial.data = {};
      }
      trial.data.task = trial.data.task || 'response';

      if (trial.choices && Array.isArray(trial.choices)) {
        const choices = trial.choices.slice();
        const otherIndex = choices.findIndex(c => c && c.includes('他'));
        if (otherIndex !== -1) {
          const otherChoice = choices.splice(otherIndex, 1)[0];
          trial.choices = jsPsych.randomization.shuffle(choices).concat([otherChoice]);
        } else {
          trial.choices = jsPsych.randomization.shuffle(choices);
        }
        trial.data.shuffled_choices = trial.choices.slice();
      }
    },
    on_finish: function(data) {
      const choiceIndex = data.response;
      let selectedChoice = null;
      
      if (typeof choiceIndex === 'number' && data.shuffled_choices && data.shuffled_choices[choiceIndex]) {
        selectedChoice = data.shuffled_choices[choiceIndex];
      }
      
      data.chosen_choice = selectedChoice;
      if (selectedChoice && selectedChoice.includes('他')) {
        data.other_sound = String(data.other_sound || '').trim();
      }
      data.correct = selectedChoice === data.correct_response;
    }
  };

  const otherTextTrial = {
    type: jsPsychSurveyText,
    questions: [
      {
        prompt: '<div style="margin-bottom: 15px;"><strong>Please enter the sound you heard in romaji below.</strong><br/><strong style="display:block; margin-top:8px;">下記に聞こえた音をローマ字で入力してください</strong><br/><span style="color: #aaa; font-size: 14px;">e.g., di, ti, fi, ri</span><br/><span style="color: #aaa; font-size: 14px;">例：di, ti, fi, ri など</span><br/><br/><span style="color: #ffcc00; font-size: 0.9em;"><strong>If the perceived sound differs from the provided options:</strong><br/>If you hear "si", enter <strong>si</strong>.<br/>If you hear "ti", enter <strong>ti</strong>.<br/>If you hear "fi", enter <strong>fi</strong>.<br/><br/>補足：<br/>想定された選択肢と異なる音に聞こえた場合は、si・ti・fi などをご入力ください。</span></div>',
        name: 'other_sound',
        placeholder: 'Enter romaji / ローマ字を入力',
        required: true
      }
    ],
    data: {
      task: 'other_text'
    },
    on_finish: function(data) {
      let responses = data.response;
      if (typeof responses === 'string') {
        try {
          responses = JSON.parse(responses);
        } catch (e) {
          responses = {};
        }
      }
      if (typeof responses === 'object' && responses !== null) {
        data.other_sound = responses.other_sound || '';
      } else {
        data.other_sound = '';
      }
    }
  };

  const otherTextTimeline = {
    timeline: [otherTextTrial],
    conditional_function: function() {
      const last = jsPsych.data.get().last(1).values()[0];
      return last.chosen_choice && last.chosen_choice.includes('他') && !String(last.other_sound || '').trim();
    }
  };

  const dummyIntro = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div style="text-align: left; max-width: 800px; margin: 0 auto; color: #fff;">
        <h2 style="text-align: center;">練習問題 / Practice</h2>
        <p>Before the main test, you will complete <strong>2 practice items</strong> to familiarize yourself with the procedure.</p>
        <p>Practice responses <strong>are not included in the final analysis</strong>; however, please answer them in the same manner as the main test.</p>
        <p>When you are ready, please press the button below to begin practice.</p>
        <hr style="margin: 18px 0; border-color: rgba(255,255,255,0.2);"/>
        <h3 style="color: #aaa;">【日本語】</h3>
        <p>本番テストの前に、<strong>2 問の練習問題</strong>があります。</p>
        <p>練習問題の回答は採点・記録の対象には含まれませんが、本番と同様にご回答ください。</p>
        <p>準備ができましたら、下のボタンを押して練習を開始してください。</p>
      </div>
    `,
    choices: ['練習問題を始める / Begin practice'],
    button_html: '<button class="jspsych-btn" style="min-width: 180px; padding: 10px 20px; font-size: 16px;">%choice%</button>'
  };

  const dummyProcedure = {
    timeline: [fixation, audioTrial, responseTrial, otherTextTimeline],
    timeline_variables: dummyTrials,
    randomize_order: false
  };

  const realStart = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div style="text-align: left; max-width: 800px; margin: 0 auto; color: #fff;">
        <h2 style="text-align: center;">本番テスト開始 / Main Test Start</h2>
        <p>The main test will now begin.</p>
        <p>From this point onward, all responses will be recorded and used for analysis.</p>
        <p>これより本番のテストを開始いたします。これからの回答はすべて記録され、結果の算出に使用されます。</p>
      </div>
    `,
    choices: ['本番テスト開始 / Begin main test'],
    button_html: '<button class="jspsych-btn" style="min-width: 180px; padding: 10px 20px; font-size: 16px;">%choice%</button>'
  };

  const trialProcedure = {
    timeline: [fixation, audioTrial, responseTrial, otherTextTimeline],
    timeline_variables: trials,
    randomize_order: true
  };
  timeline.push(dummyIntro);
  timeline.push(dummyProcedure);
  timeline.push(realStart);
  timeline.push(trialProcedure);

  const debrief = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <p>Thank you very much for your participation. Your responses are of great value to this study. We sincerely wish you continued success and good health.</p>
      <p style="margin-top: 20px; color: #999;">ご協力いただき、誠にありがとうございました。皆様の貴重なご回答は、本研究の遂行に大変有益です。皆様の今後ますますのご活躍とご健勝をお祈り申し上げます。</p>
      <div style="margin-top: 24px; padding: 16px 20px; background: #1a1a1a; border: 1px solid #ffcc00; border-radius: 6px; font-size: 14px; line-height: 1.8; text-align: left;">
        <p style="color: #ffcc00; margin: 0 0 8px 0;"><strong>📋 備考 / Note</strong></p>
        <p style="margin: 0 0 6px 0;">When you press the button below, a <strong>response data file</strong> will be downloaded automatically.<br>
        Submitting your data to the server may take up to <strong>2 minutes</strong>, depending on network conditions. Please wait until the completion message appears.<br>
        Please retain this file in case of server or network issues; the researcher may request it at a later date via email:<br>
        <strong>u548378a@ecs.osaka-u.ac.jp</strong></p>
        <hr style="border-color: rgba(255,255,255,0.15); margin: 10px 0;"/>
        <p style="margin: 0; color: #ccc;">送信ボタンを押すと、<strong>回答データファイル（ResultPattern.csv）</strong>が自動的にダウンロードされます。<br>
        ネットワーク状況により、サーバーへの送信には<strong>最大2分程度</strong>かかる場合があります。完了メッセージが表示されるまでお待ちください。<br>
        サーバーやインターネット接続に問題が生じた場合に備え、このファイルを保管しておいてください。<br>
        後日、研究者よりファイルの提供をお願いする場合がございます。<br>
        連絡先: <strong>u548378a@ecs.osaka-u.ac.jp</strong></p>
      </div>
    `,
    choices: ['回答データをサーバーに送信する / Submit responses to server'],
    button_html: '<button class="jspsych-btn" style="min-width: 180px; padding: 10px 20px; font-size: 16px;">%choice%</button>'
  };
  timeline.push(debrief);

  jsPsych.run(timeline);
</script>
</html>
