<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>日本語音声聴覚識別調査 / Japanese Speech Perception Study</title>
  <script src="https://unpkg.com/jspsych@7.3.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.0"></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/jspsych@7.3.3/css/jspsych.css" rel="stylesheet" />
  <style>
    :root {
      --ink: #ecf1f8;
      --muted-ink: #bfd0e7;
      --panel: rgba(10, 22, 40, 0.62);
      --panel-border: rgba(181, 206, 240, 0.36);
      --accent: #b7cced;
      --accent-strong: #85abde;
      --focus-ring: rgba(133, 171, 222, 0.45);
      --shadow: 0 22px 50px rgba(1, 7, 18, 0.5);
      --brand-header-space: 64px;
      --brand-footer-space: 44px;
      --ui-font-base: clamp(15px, 0.45vw + 13px, 19px);
      --ui-font-small: clamp(13px, 0.32vw + 11.5px, 16px);
      --ui-font-heading-1: clamp(21px, 1vw + 16px, 34px);
      --ui-font-heading-2: clamp(19px, 0.8vw + 15px, 30px);
      --ui-font-heading-3: clamp(17px, 0.65vw + 14px, 24px);
      --ui-control-height: clamp(46px, 1.35vw + 38px, 58px);
      --ui-content-pad-y: clamp(16px, 1.05vw + 10px, 28px);
      --ui-content-pad-x: clamp(12px, 1.1vw + 7px, 26px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'IBM Plex Sans', 'Noto Sans JP', sans-serif;
      font-size: var(--ui-font-base);
      background: radial-gradient(circle at 12% 8%, rgba(123, 163, 209, 0.24), transparent 45%),
                  radial-gradient(circle at 88% 16%, rgba(150, 190, 233, 0.16), transparent 38%),
                  linear-gradient(135deg, #020a15 0%, #071224 55%, #0b1a30 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url('osakabg.jpg');
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
      opacity: 0.28;
      filter: saturate(1.14) contrast(1.08) brightness(1.03);
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(to bottom, rgba(4, 11, 23, 0.2), rgba(4, 11, 23, 0.68));
      z-index: -1;
      pointer-events: none;
    }

    .wizard-scroll {
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      flex: 1 1 auto;
      min-height: 0;
      padding-right: 6px;
    }

    .wizard-nav {
      flex: 0 0 auto;
      position: sticky;
      bottom: 0;
      background: transparent;
      border-top: none;
      padding-top: 12px;
      margin-top: 10px;
    }

    #jspsych-content .wizard-help-text {
      margin-top: 6px;
      color: #c8d4e5;
      font-size: 0.78em !important;
      line-height: 1.45 !important;
    }

    .jspsych-display-element,
    .jspsych-content-wrapper {
      background: transparent;
      color: var(--ink);
      font-family: 'IBM Plex Sans', 'Noto Sans JP', sans-serif;
    }

    .jspsych-display-element {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    #jspsych-content {
      margin: 0 auto;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      border-radius: 14px;
      padding: var(--ui-content-pad-y) var(--ui-content-pad-x);
      max-width: 960px;
      width: min(960px, 100%);
      font-size: var(--ui-font-base);
      line-height: 1.5;
    }

    .jspsych-content-wrapper {
      padding: calc(var(--brand-header-space) + 14px) 12px calc(var(--brand-footer-space) + 24px);
      display: flex;
      justify-content: center;
    }

    h1, h2, h3 {
      letter-spacing: 0.02em;
    }

    #jspsych-content h1 {
      font-size: var(--ui-font-heading-1);
      line-height: 1.32;
    }

    #jspsych-content h2 {
      font-size: var(--ui-font-heading-2);
      line-height: 1.35;
    }

    #jspsych-content h3 {
      font-size: var(--ui-font-heading-3);
      line-height: 1.36;
    }

    #jspsych-content p,
    #jspsych-content li,
    #jspsych-content label,
    #jspsych-content span,
    #jspsych-content div {
      font-size: var(--ui-font-base);
      line-height: 1.5;
    }

    .jspsych-btn {
      background: rgba(55, 101, 157, 0.34);
      color: #f7fbff;
      border: 1px solid rgba(168, 204, 245, 0.78);
      border-radius: 8px;
      font-weight: 600;
      padding: 9px 18px;
      transition: transform 120ms ease, box-shadow 160ms ease, background 160ms ease;
      box-shadow: 0 10px 22px rgba(6, 17, 34, 0.44);
    }

    .jspsych-btn:hover {
      transform: translateY(-1px);
      background: rgba(79, 139, 207, 0.5);
      box-shadow: 0 12px 24px rgba(7, 20, 40, 0.42);
    }

    .jspsych-btn:active {
      transform: translateY(0);
      box-shadow: 0 5px 12px rgba(7, 20, 40, 0.32);
    }

    .jspsych-btn:disabled,
    button:disabled {
      cursor: not-allowed;
      opacity: 0.58;
      transform: none;
    }

    button,
    select,
    input,
    textarea {
      touch-action: manipulation;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }

    .jspsych-btn.answer-choice {
      background: linear-gradient(180deg, #2a4f80, #1b3457);
      border-color: #93b7e4;
    }

    .jspsych-btn.answer-choice:hover {
      background: linear-gradient(180deg, #316094, #224169);
    }

    .audio-task {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    .audio-task-kicker {
      margin: 0 0 8px;
      color: var(--accent-strong);
      font-size: 0.78em !important;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .audio-task-title {
      margin: 0 0 10px;
      font-size: clamp(22px, 1.8vw + 16px, 32px) !important;
      line-height: 1.25 !important;
    }

    .audio-task-instructions {
      max-width: 600px;
      margin: 0 auto;
      color: var(--muted-ink);
      line-height: 1.65 !important;
    }

    .audio-task-action {
      margin: 26px auto 12px;
      padding: 15px 28px;
      min-width: min(100%, 280px);
      min-height: 56px;
      font-size: 1em !important;
    }

    .audio-task-status {
      min-height: 1.5em;
      margin: 0;
      color: var(--muted-ink);
      font-size: 0.9em !important;
    }

    .audio-task-help {
      max-width: 600px;
      margin: 24px auto 0;
      padding: 14px 16px;
      border: 1px solid rgba(181, 206, 240, 0.2);
      border-radius: 8px;
      color: var(--muted-ink);
      font-size: 0.78em !important;
      line-height: 1.6 !important;
      text-align: left;
    }

    .language-selection {
      max-width: 520px;
      margin: 0 auto;
      padding: clamp(20px, 2.2vw, 32px) clamp(16px, 2.4vw, 30px);
      border: 1px solid rgba(181, 206, 240, 0.42);
      border-radius: 10px;
      background: rgba(10, 25, 45, 0.86);
      box-shadow: 0 16px 34px rgba(1, 7, 18, 0.32);
      text-align: center;
    }

    .language-selection h2 {
      margin-bottom: 10px;
    }

    .language-selection p:not(.audio-task-kicker) {
      color: var(--muted-ink);
    }

    .language-selection label {
      display: block;
      margin: 24px 0 8px;
      font-weight: 600;
    }

    .language-selection select {
      width: 100%;
    }

    .consent-screen {
      max-width: 760px;
      margin: 0 auto;
      text-align: center;
    }

    .consent-title {
      margin: 0 0 8px;
      color: #ffffff;
      font-size: clamp(26px, 2vw + 18px, 38px) !important;
      line-height: 1.2 !important;
    }

    .consent-subtitle {
      margin: 0 0 24px;
      color: var(--muted-ink);
      font-size: 0.98em !important;
    }

    .consent-card {
      padding: clamp(18px, 2vw + 10px, 28px);
      border: 1px solid rgba(181, 206, 240, 0.48);
      border-radius: 10px;
      background: rgba(10, 25, 45, 0.88);
      box-shadow: 0 16px 34px rgba(1, 7, 18, 0.34);
      text-align: center;
    }

    .consent-card-title {
      display: block;
      margin-bottom: 14px;
      color: #ffda72;
      font-size: 1.08em !important;
    }

    .consent-notice {
      margin: 0;
      color: #f5f8ff;
      line-height: 1.7 !important;
    }

    .consent-voluntary {
      margin: 18px 0 0;
      padding-top: 16px;
      border-top: 1px solid rgba(181, 206, 240, 0.24);
      color: #dce8f8;
      line-height: 1.7 !important;
    }

    .consent-contact {
      margin: 18px 0 0;
      padding: 12px 14px;
      border-left: 3px solid var(--accent-strong);
      background: rgba(133, 171, 222, 0.12);
      color: #eaf2ff;
      line-height: 1.6 !important;
      text-align: center;
    }

    .consent-contact strong {
      color: #b9d7ff;
    }

    .instruction-screen {
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(20px, 2.2vw, 32px) clamp(16px, 2.4vw, 30px);
      border: 1px solid rgba(181, 206, 240, 0.42);
      border-radius: 10px;
      background: rgba(10, 25, 45, 0.86);
      box-shadow: 0 16px 34px rgba(1, 7, 18, 0.32);
      text-align: center;
    }

    .instruction-screen p {
      margin: 14px 0;
    }

    .instruction-screen .instruction-emphasis {
      margin-top: 22px;
      padding: 12px 14px;
      border-left: 3px solid #ffcc00;
      background: rgba(255, 204, 0, 0.14);
      color: #ffdf75;
      text-align: center;
    }

    .stage-intro {
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(20px, 2.2vw, 32px) clamp(16px, 2.4vw, 30px);
      border: 1px solid rgba(181, 206, 240, 0.42);
      border-radius: 10px;
      background: rgba(10, 25, 45, 0.86);
      box-shadow: 0 16px 34px rgba(1, 7, 18, 0.32);
      text-align: center;
    }

    .stage-intro p:not(.audio-task-kicker) {
      margin: 14px 0 0;
      color: var(--muted-ink);
      line-height: 1.7 !important;
    }

    .consent-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin-top: 24px;
    }

    .consent-actions .jspsych-btn {
      min-width: 190px;
      margin: 0;
    }

    .consent-actions .consent-accept {
      background: rgba(40, 123, 98, 0.38);
      border-color: rgba(141, 224, 190, 0.86);
    }

    .consent-actions .consent-decline {
      background: rgba(91, 42, 55, 0.38);
      border-color: rgba(240, 157, 174, 0.78);
      color: #ffe8ed;
    }

    #study-progress {
      display: none;
      position: fixed;
      right: 16px;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 16px;
      z-index: 18;
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 12px 10px;
      border: 1px solid rgba(181, 206, 240, 0.32);
      border-radius: 8px;
      background: rgba(7, 18, 35, 0.94);
      box-shadow: 0 8px 22px rgba(2, 8, 18, 0.38);
      pointer-events: none;
    }

    #study-progress-label {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
      color: #eaf2ff;
      font-size: 0.78rem;
      line-height: 1.2;
    }

    #study-progress-track {
      width: 100%;
      height: 7px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(181, 206, 240, 0.22);
    }

    #study-progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #78cdb0, #b7e7d2);
      transition: width 220ms ease;
    }

    @media (max-width: 760px) {
      .audio-task {
        padding: 4px 0;
      }

      .audio-task-action {
        width: 100%;
        margin-top: 22px;
      }

      .audio-task-help {
        margin-top: 20px;
        padding: 12px;
      }

      .consent-actions {
        flex-direction: column;
      }

      .consent-actions .jspsych-btn {
        width: 100%;
      }

      #study-progress {
        right: 8px;
        bottom: max(6px, env(safe-area-inset-bottom));
        left: 8px;
        padding: 7px 10px 9px;
      }
    }

    button:not(.jspsych-btn) {
      color: #f7fbff !important;
      border-color: rgba(150, 184, 226, 0.82) !important;
      background: rgba(55, 101, 157, 0.32) !important;
      box-shadow: 0 8px 18px rgba(6, 17, 34, 0.28);
    }

    button:not(.jspsych-btn):hover {
      background: rgba(79, 139, 207, 0.48) !important;
    }

    .jspsych-btn:focus-visible,
    button:focus-visible,
    select:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus-ring);
    }

    select,
    input[type="text"],
    input[type="email"],
    textarea {
      background: rgba(7, 18, 33, 0.7);
      color: #f4f8ff;
      border: 1px solid #7fa2ce;
      border-radius: 7px;
      padding: 8px 9px;
      font-family: 'IBM Plex Sans', 'Noto Sans JP', sans-serif;
    }

    #jspsych-content .jspsych-btn,
    #jspsych-content button:not(.jspsych-btn) {
      min-height: var(--ui-control-height);
      font-size: var(--ui-font-base);
      line-height: 1.28;
      padding: clamp(10px, 0.45vw + 8px, 14px) clamp(12px, 0.8vw + 8px, 18px);
    }

    #jspsych-content select,
    #jspsych-content input[type="text"],
    #jspsych-content input[type="email"],
    #jspsych-content textarea {
      min-height: var(--ui-control-height);
      font-size: var(--ui-font-base);
      width: min(100%, 100%);
      line-height: 1.35;
    }

    #jspsych-content input::placeholder,
    #jspsych-content textarea::placeholder {
      font-size: var(--ui-font-small);
    }

    #jspsych-content [style*="font-size: 72px"] {
      font-size: clamp(44px, 6vw + 18px, 72px) !important;
    }

    #jspsych-content [style*="font-size: 64px"] {
      font-size: clamp(40px, 5.5vw + 16px, 64px) !important;
    }

    #jspsych-content [style*="font-size: 24px"] {
      font-size: clamp(20px, 1vw + 16px, 28px) !important;
    }

    #jspsych-content [style*="font-size: 18px"] {
      font-size: clamp(17px, 0.55vw + 14px, 23px) !important;
    }

    #jspsych-content [style*="font-size: 16px"] {
      font-size: clamp(15px, 0.45vw + 13px, 20px) !important;
    }

    #jspsych-content [style*="font-size: 14px"] {
      font-size: clamp(13px, 0.35vw + 11.5px, 17px) !important;
    }

    #jspsych-content [style*="padding: 30px 20px"],
    #jspsych-content [style*="padding:30px 20px"] {
      padding: clamp(16px, 1.4vw + 10px, 30px) clamp(12px, 1.05vw + 8px, 20px) !important;
    }

    #jspsych-content [style*="padding: 20px"],
    #jspsych-content [style*="padding:20px"] {
      padding: clamp(12px, 0.95vw + 8px, 20px) !important;
    }

    div[style*="background:#333"],
    div[style*="background: #333"],
    div[style*="background:#1a1a1a"],
    div[style*="background: #1a1a1a"],
    div[style*="background:#111"],
    div[style*="background: #111"] {
      background: rgba(12, 26, 46, 0.56) !important;
      border-color: rgba(166, 197, 236, 0.3) !important;
      backdrop-filter: blur(10px);
    }

    #ouBrandHeader {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: min(980px, calc(100vw - 24px));
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: rgba(7, 16, 30, 0.7);
      border: 1px solid rgba(171, 196, 229, 0.28);
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 28px rgba(3, 10, 20, 0.34);
      z-index: 20;
      pointer-events: none;
    }

    #ouBrandHeader img {
      width: 34px;
      height: 34px;
      object-fit: contain;
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.92);
      padding: 3px;
    }

    #ouBrandHeader .brand-text {
      line-height: 1.2;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    #ouBrandHeader .brand-ja {
      font-size: 0.78rem;
      font-weight: 700;
      color: #eff5ff;
    }

    #ouBrandHeader .brand-en {
      font-size: 0.62rem;
      letter-spacing: 0.04em;
      color: var(--muted-ink);
      text-transform: uppercase;
      font-weight: 500;
    }

    #ouTopCredit {
      display: none;
    }

    #ouLoadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 9, 18, 0.72);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #ouLoadingOverlay .ou-loading-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      background: rgba(10, 22, 40, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 28px 32px;
      max-width: 360px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    #ouLoadingOverlay .ou-spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid rgba(183, 204, 237, 0.25);
      border-top-color: var(--accent-strong);
      animation: ouSpin 0.9s linear infinite;
    }

    @keyframes ouSpin {
      to { transform: rotate(360deg); }
    }

    #ouLoadingOverlay .ou-loading-text {
      font-size: 0.92rem;
      line-height: 1.6;
      color: var(--ink);
    }

    #ouFooter {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      right: auto;
      bottom: max(8px, env(safe-area-inset-bottom));
      width: min(980px, calc(100vw - 24px));
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid rgba(183, 209, 243, 0.24);
      background: rgba(7, 18, 35, 0.62);
      backdrop-filter: blur(7px);
      color: #ffffff;
      text-align: left;
      line-height: 1.2;
      font-size: 0.62rem;
      text-shadow: 0 1px 10px rgba(4, 11, 22, 0.68);
      z-index: 19;
      pointer-events: none;
      overflow: hidden;
    }

    #ouFooter .footer-layout {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    #ouFooter .footer-text {
      min-width: 0;
      flex: 1 1 auto;
      text-align: left;
    }

    #ouFooter .footer-line {
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #ouFooter .footer-line + .footer-line {
      margin-top: 2px;
    }

    #ouFooter strong {
      font-weight: 700;
    }

    #ouFooter .footer-logo {
      width: 26px;
      height: 26px;
      object-fit: contain;
      flex: 0 0 auto;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.94);
      padding: 2px;
      box-shadow: 0 4px 10px rgba(6, 17, 34, 0.28);
      align-self: center;
    }

    @media (max-width: 760px) {
      html {
        -webkit-text-size-adjust: 100%;
      }

      :root {
        --ui-font-base: clamp(15px, 1.05vw + 11px, 18px);
        --ui-font-small: clamp(13px, 0.75vw + 10.5px, 15px);
        --ui-control-height: clamp(50px, 1.7vw + 44px, 58px);
      }

      #jspsych-content {
        border-radius: 12px;
        padding: 20px 14px;
        width: min(100%, calc(100vw - 16px));
      }

      #jspsych-content,
      #jspsych-content p,
      #jspsych-content li,
      #jspsych-content label,
      #jspsych-content span,
      #jspsych-content div {
        font-size: var(--ui-font-base) !important;
        line-height: 1.5 !important;
      }

      #jspsych-content h1 {
        font-size: var(--ui-font-heading-1) !important;
        line-height: 1.35 !important;
      }

      #jspsych-content h2 {
        font-size: var(--ui-font-heading-2) !important;
        line-height: 1.35 !important;
      }

      #jspsych-content h3 {

<body></body>
<script>
  function mountBrandHeader() {
    if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) return;
    if (document.getElementById('ouBrandHeader')) return;

    const header = document.createElement('div');
    header.id = 'ouBrandHeader';
    header.innerHTML = `
      <img src="ou_logo.png" alt="Osaka University logo" />
    `;
    document.body.appendChild(header);
  }

  function mountTopCredit() {
    if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) return;
    if (document.getElementById('ouTopCredit')) return;

    const credit = document.createElement('div');
    credit.id = 'ouTopCredit';
    credit.textContent = 'Perception Test Module Developed by : KEHANAN Akarapong';
    document.body.appendChild(credit);
  }

  mountBrandHeader();

  function mountFooter() {
    if (window.matchMedia && window.matchMedia('(max-width: 760px)').matches) return;
    if (document.getElementById('ouFooter')) return;

    const footer = document.createElement('div');
    footer.id = 'ouFooter';
    footer.innerHTML = `
      <div class="footer-layout">
        <div class="footer-text">
          <p class="footer-line">u548378a@ecs.osaka-u.ac.jp</p>
        </div>
        <img class="footer-logo" src="ou_logo.png" alt="Osaka University logo" />
      </div>
    `;
    document.body.appendChild(footer);
  }

  function ensurePersistentBranding() {
    mountTopCredit();
    mountBrandHeader();
    mountFooter();
    syncBrandingLayoutSpacing();
  }

  function syncBrandingLayoutSpacing() {
    const root = document.documentElement;
    const header = document.getElementById('ouBrandHeader');
    const footer = document.getElementById('ouFooter');
    const isMobile = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;

    const headerHeight = isMobile
      ? 12
      : header
      ? Math.ceil(header.getBoundingClientRect().height) + 18
      : 88;
    const footerHeight = isMobile
      ? 12
      : footer
      ? Math.ceil(footer.getBoundingClientRect().height) + 18
      : 92;

    root.style.setProperty('--brand-header-space', `${headerHeight}px`);
    root.style.setProperty('--brand-footer-space', `${footerHeight}px`);
  }

  let brandingLayoutSyncStarted = false;
  function startBrandingLayoutSync() {
    if (brandingLayoutSyncStarted) return;
    brandingLayoutSyncStarted = true;

    window.addEventListener('resize', syncBrandingLayoutSpacing);
    window.addEventListener('orientationchange', syncBrandingLayoutSpacing);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', syncBrandingLayoutSpacing);
    }

    if (window.ResizeObserver) {
      const resizeObserver = new ResizeObserver(function() {
        syncBrandingLayoutSpacing();
      });

      const tryObserve = () => {
        const header = document.getElementById('ouBrandHeader');
        const footer = document.getElementById('ouFooter');
        if (header) resizeObserver.observe(header);
        if (footer) resizeObserver.observe(footer);
      };

      tryObserve();
      setTimeout(tryObserve, 0);
    }

    // Re-sync after fonts/images finish loading, since the header/footer can
    // grow after the initial measurement and overlap the content otherwise.
    window.addEventListener('load', syncBrandingLayoutSpacing);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(syncBrandingLayoutSpacing).catch(() => {});
    }

    syncBrandingLayoutSpacing();
  }

  let brandingObserverStarted = false;
  function startBrandingObserver() {
    if (brandingObserverStarted || !document.body) return;
    brandingObserverStarted = true;

    const observer = new MutationObserver(function() {
      const isMobile = window.matchMedia && window.matchMedia('(max-width: 760px)').matches;
      const missingDesktopBranding = !isMobile && (
        !document.getElementById('ouTopCredit') ||
        !document.getElementById('ouBrandHeader') ||
        !document.getElementById('ouFooter')
      );

      if (missingDesktopBranding) {
        ensurePersistentBranding();
      }
      syncBrandingLayoutSpacing();
    });

    observer.observe(document.body, { childList: true });
  }

  ensurePersistentBranding();
  startBrandingObserver();
  startBrandingLayoutSync();

  function updateStudyProgress(label, current, total) {
    let progress = document.getElementById('study-progress');
    if (!progress) {
      progress = document.createElement('div');
      progress.id = 'study-progress';
      progress.setAttribute('role', 'progressbar');
      progress.setAttribute('aria-valuemin', '0');
      progress.innerHTML = `
        <div id="study-progress-label">
          <span id="study-progress-text"></span>
          <span id="study-progress-percent"></span>
        </div>
        <div id="study-progress-track">
          <div id="study-progress-fill"></div>
        </div>
      `;
      document.body.appendChild(progress);
    }

    const safeTotal = Math.max(1, Number(total) || 1);
    const safeCurrent = Math.min(Math.max(0, Number(current) || 0), safeTotal);
    const percent = Math.round((safeCurrent / safeTotal) * 100);
    const textEl = document.getElementById('study-progress-text');
    const percentEl = document.getElementById('study-progress-percent');
    const fillEl = document.getElementById('study-progress-fill');

    if (textEl) textEl.textContent = `${label} ${safeCurrent} / ${safeTotal}`;
    if (percentEl) percentEl.textContent = `${percent}%`;
    if (fillEl) fillEl.style.width = `${percent}%`;
    progress.setAttribute('aria-valuemax', String(safeTotal));
    progress.setAttribute('aria-valuenow', String(safeCurrent));
    progress.style.display = 'block';
  }

  function hideStudyProgress() {
    const progress = document.getElementById('study-progress');
    if (progress) progress.style.display = 'none';
  }

  // ========================================
  // Mapping: stimulus (kana) -> audio filename (romaji, no extension)
  // ========================================
  const stimulusToRomaji = {
    'し':'shi', 'ち':'chi', 'ひ':'hi', 'に':'ni', 'ぎ':'gi', 'じ':'ji', 'き':'ki', 'り':'ri', 'み':'mi', 'び':'bi', 'ぴ':'pi',
    'きゃ':'kya', 'きゅ':'kyu', 'きょ':'kyo',
    'ぎゃ':'gya', 'ぎゅ':'gyu', 'ぎょ':'gyo',
    'しゃ':'sha', 'しゅ':'shu', 'しょ':'sho',
    'じゃ':'ja', 'じゅ':'ju', 'じょ':'jo',
    'ちゃ':'cha', 'ちゅ':'chu', 'ちょ':'cho',
    'にゃ':'nya', 'にゅ':'nyu', 'にょ':'nyo',
    'ひゃ':'hya', 'ひゅ':'hyu', 'ひょ':'hyo',
    'ぴゃ':'pya', 'ぴゅ':'pyu', 'ぴょ':'pyo',
    'びゃ':'bya', 'びゅ':'byu', 'びょ':'byo',
    'みゃ':'mya', 'みゅ':'myu', 'みょ':'myo',
    'りゃ':'rya', 'りゅ':'ryu', 'りょ':'ryo',
    'か':'ka', 'た':'ta'
  };

  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYHlkCLsRIJifCDTMFdmLwXyz9PC31ReUz-RxWbasI3ywEVrn_LF9AKzWx-5bp6sXi0Q/exec';
  const PENDING_SUBMISSIONS_KEY = 'palatalizedsoundtest_pending_submissions';
  const PRE_SURVEY_CACHE_KEY = 'palatalizedsoundtest_pre_survey_cache';
  let confirmedPreSurveyData = null;

  function savePreSurveyCache(data) {
    confirmedPreSurveyData = data && typeof data === 'object' ? { ...data } : null;
    try {
      if (confirmedPreSurveyData) {
        sessionStorage.setItem(PRE_SURVEY_CACHE_KEY, JSON.stringify(confirmedPreSurveyData));
      }
    } catch (error) {
      console.warn('Unable to persist pre-survey cache:', error);
    }
  }

  function loadPreSurveyCache() {
    if (confirmedPreSurveyData && typeof confirmedPreSurveyData === 'object') {
      return confirmedPreSurveyData;
    }

    try {
      const raw = sessionStorage.getItem(PRE_SURVEY_CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') {
        confirmedPreSurveyData = parsed;
        return confirmedPreSurveyData;
      }
    } catch (error) {
      console.warn('Unable to read pre-survey cache:', error);
    }

    return null;
  }

  function createSubmissionId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }

    return 'submission-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function readPendingSubmissions() {
    try {
      const raw = localStorage.getItem(PENDING_SUBMISSIONS_KEY);
      if (!raw) return [];

      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      console.error('Unable to read pending submissions:', error);
      return [];
    }
  }

  function writePendingSubmissions(items) {
    try {
      localStorage.setItem(PENDING_SUBMISSIONS_KEY, JSON.stringify(items));
    } catch (error) {
      console.error('Unable to persist pending submissions:', error);
    }
  }

  function queueSubmission(payload) {
    const items = readPendingSubmissions();
    const existingIndex = items.findIndex(item => item.submissionId === payload.submission_id);
    const entry = {
      submissionId: payload.submission_id,
      payload,
      queuedAt: new Date().toISOString(),
      attempts: existingIndex >= 0 ? items[existingIndex].attempts || 0 : 0,
      lastError: existingIndex >= 0 ? items[existingIndex].lastError || '' : ''
    };

    if (existingIndex >= 0) {
      items[existingIndex] = entry;
    } else {
      items.push(entry);
    }

    writePendingSubmissions(items);
  }

  function updateQueuedSubmission(submissionId, updates) {
    const items = readPendingSubmissions();
    const index = items.findIndex(item => item.submissionId === submissionId);
    if (index === -1) return;

    items[index] = {
      ...items[index],
      ...updates
    };
    writePendingSubmissions(items);
  }

  function removeQueuedSubmission(submissionId) {
    const items = readPendingSubmissions().filter(item => item.submissionId !== submissionId);
    writePendingSubmissions(items);
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function showLoadingOverlay(message) {
    let overlay = document.getElementById('ouLoadingOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'ouLoadingOverlay';
      overlay.innerHTML = `
        <div class="ou-loading-box">
          <div class="ou-spinner"></div>
          <div class="ou-loading-text" id="ouLoadingText"></div>
        </div>
      `;
      document.body.appendChild(overlay);
    }

    const textEl = document.getElementById('ouLoadingText');
    if (textEl) textEl.innerHTML = message;
    overlay.style.display = 'flex';
  }

  function hideLoadingOverlay() {
    const overlay = document.getElementById('ouLoadingOverlay');
    if (overlay) overlay.style.display = 'none';
  }

  async function postSubmission(payload) {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload),
      keepalive: true
    });

    const responseText = await response.text();
    let result = null;

    if (responseText) {
      try {
        result = JSON.parse(responseText);
      } catch (parseError) {
        // Some mobile browsers cannot read cross-origin JSON body reliably.
        // If HTTP status is success, treat this as delivered and continue.
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText} | Invalid response body: ${responseText}`);
        }

        result = {
          success: true,
          fallback: 'non_json_success_response'
        };
      }
    }

    if (!response.ok) {
      throw new Error(`HTTP ${response.status} ${response.statusText} | ${(result && result.error) || responseText || 'Request failed'}`);
    }

    if (result && result.success === false) {
      throw new Error(result.error || 'Google Apps Script returned success=false');
    }

    if (!result) {
      result = { success: true, fallback: 'empty_success_response' };
    }

    return { response, result, responseText };
  }

  async function postSubmissionFallback(payload) {
    const bodyText = JSON.stringify(payload);

    if (navigator.sendBeacon) {
      const beaconBody = new Blob([bodyText], { type: 'text/plain;charset=utf-8' });
      const accepted = navigator.sendBeacon(GOOGLE_SCRIPT_URL, beaconBody);
      if (accepted) {
        return {
          response: { status: 0, statusText: 'sendBeacon accepted' },
          result: { success: true, fallback: 'sendBeacon' },
          responseText: ''
        };
      }
    }

    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: bodyText,
      keepalive: true
    });

    return {
      response: { status: 0, statusText: 'no-cors' },
      result: { success: true, fallback: 'no-cors' },
      responseText: ''
    };
  }

  async function submitWithRetry(payload, maxAttempts, retryDelayMs) {
    let attempt = 0;
    let lastError = null;

    while (attempt < maxAttempts) {
      attempt += 1;
      updateQueuedSubmission(payload.submission_id, {
        attempts: attempt,
        lastError: ''
      });

      try {
        return await postSubmission(payload);
      } catch (error) {
        lastError = error;

        const isLastAttempt = attempt >= maxAttempts;
        const isFetchNetworkError = error && error.message && error.message.toLowerCase().indexOf('failed to fetch') !== -1;

        if (isLastAttempt && isFetchNetworkError) {
          try {
            const fallbackResult = await postSubmissionFallback(payload);
            updateQueuedSubmission(payload.submission_id, {
              attempts: attempt,
              lastError: '',
              lastAttemptAt: new Date().toISOString(),
              fallbackUsed: fallbackResult.result.fallback
            });
            return fallbackResult;
          } catch (fallbackError) {
            lastError = fallbackError;
          }
        }

        updateQueuedSubmission(payload.submission_id, {
          attempts: attempt,
          lastError: (lastError && lastError.message) ? lastError.message : String(lastError || error),
          lastAttemptAt: new Date().toISOString()
        });

        if (attempt < maxAttempts) {
          await delay(retryDelayMs);
        }
      }
    }

    throw lastError || new Error('Submission failed');
  }

  async function flushPendingSubmissions() {
    const pending = readPendingSubmissions();
    if (pending.length === 0) return;

    for (const entry of pending) {
      try {
        const result = await submitWithRetry(entry.payload, 2, 1500);
        console.log('Retried pending submission successfully:', {
          submissionId: entry.submissionId,
          status: result.response.status,
          result: result.result
        });
        removeQueuedSubmission(entry.submissionId);
      } catch (error) {
        console.error('Pending submission still failing:', entry.submissionId, error);
      }
    }
  }

  flushPendingSubmissions();

  // ========================================
  // Step 1: Initialize jsPsych and configure result submission to Google Sheets.
  // ========================================
  const jsPsych = initJsPsych({
    on_trial_start: function() {
      const contentCard = document.getElementById('jspsych-content');
      if (contentCard) {
        // Reset per-trial layout overrides (used by specific screens like consent)
        // so they do not leak into subsequent pages.
        contentCard.style.display = '';
        contentCard.style.flexDirection = '';
        contentCard.style.maxHeight = '';
      }

      ensurePersistentBranding();
      syncBrandingLayoutSpacing();
    },
    on_finish: function() {
      ensurePersistentBranding();
      syncBrandingLayoutSpacing();
      const allData = jsPsych.data.get().values();
      const responseRows = allData.filter(r => r.task === 'response');

      const findLatestByTask = (taskName) => {
        for (let i = allData.length - 1; i >= 0; i--) {
          if (allData[i] && allData[i].task === taskName) return allData[i];
        }
        return {};
      };
      
      // ===================== Fixed 44-item stimulus order =====================
      const stimulusOrder = [
        'し','ち','ひ','に','ぎ','じ','き','り','み','び','ぴ',
        'きゃ','きゅ','きょ','ぎゃ','ぎゅ','ぎょ',
        'しゃ','しゅ','しょ','じゃ','じゅ','じょ',
        'ちゃ','ちゅ','ちょ','にゃ','にゅ','にょ',
        'ひゃ','ひゅ','ひょ','ぴゃ','ぴゅ','ぴょ',
        'びゃ','びゅ','びょ','みゃ','みゅ','みょ',
        'りゃ','りゅ','りょ'
      ];
      
      const tanOnList = ['し','ち','ひ','に','ぎ','じ','き','り','み','び','ぴ'];
      
      // ===================== Collect base participant data =====================
      const preFormData = findLatestByTask('pre_survey_form');
      const preLangData = findLatestByTask('pre_survey_languages');
      const preChoiceData = findLatestByTask('pre_survey_choice');
      const preInstData = findLatestByTask('pre_survey_institution');
      const preWizardData = findLatestByTask('pre_survey_wizard');
      const preSurveyData = loadPreSurveyCache() || preWizardData || {};

      const studyYear = preSurveyData.study_year || preFormData.study_year || '';
      const studyMonth = preSurveyData.study_month || preFormData.study_month || '';
      const stayYear = preSurveyData.stay_year || preFormData.stay_year || '';
      const stayMonth = preSurveyData.stay_month || preFormData.stay_month || '';
      const nativeLanguage = preSurveyData.native_language || preFormData.native_language || '';
      const learnedLanguagesList = preSurveyData.learned_languages_list || preLangData.learned_languages_list || preFormData.learned_languages_list || '';

      const normalizeLanguageForMetrics = (language) => {
        const value = String(language || '').trim().toLowerCase();
        if (!value) return '';
        if (['japanese (日本語)', 'japanese', '日本語'].includes(value)) return 'japanese';
        return value;
      };

      const normalizedLanguages = learnedLanguagesList
        .split(',')
        .map(item => normalizeLanguageForMetrics(item))
        .filter(Boolean);
      const japaneseIndex = normalizedLanguages.findIndex(item => item === 'japanese');
      const japaneseLanguageOrder = japaneseIndex >= 0 ? String(japaneseIndex + 1) : '';
      const totalLanguagesLearned = String(normalizedLanguages.length || '');

      const phonologyTheoryExperience = preSurveyData.phonology_theory_experience || preChoiceData.phonology_theory_experience || '';
      const email = preSurveyData.email || preChoiceData.email || preFormData.email || '';
      
      let pronExperience = preSurveyData.pron_experience || '';
      if (preChoiceData.response) {
        let resp = preChoiceData.response;
        if (typeof resp === 'string') {
          try { resp = JSON.parse(resp); } catch(e) {}
        }
        if (Array.isArray(resp)) {
          pronExperience = resp[0] || '';
        } else if (resp && typeof resp === 'object') {
          pronExperience = Object.values(resp)[0] || '';
        } else {
          pronExperience = resp;
        }
      }

      if (!pronExperience && preChoiceData.pron_experience) {
        pronExperience = preChoiceData.pron_experience;
      }
      
      let institution = '';
      if (preSurveyData.institution) {
        institution = preSurveyData.institution;
      }
      if (preInstData.response) {
        let resp = preInstData.response;
        if (typeof resp === 'string') {
          try { resp = JSON.parse(resp); } catch(e) {}
        }
        if (resp && typeof resp === 'object') {
          institution = institution || resp.institution || '';
        } else {
          institution = institution || resp || '';
        }
      } else if (preInstData.institution) {
        institution = institution || preInstData.institution;
      }

      // ===================== Build map for stimulus -> trial data =====================
      const trialMap = {};
      responseRows.forEach(d => {
        trialMap[d.stimulus] = d;
      });

      // ===================== Build result row (one row per participant) =====================
      const resultRow = {
        'email': email,
        'study_year': studyYear,
        'study_month': studyMonth,
        'stay_year': stayYear,
        'stay_month': stayMonth,
        'pron_experience': pronExperience,
        'institution': institution,
        'total_languages_learned': totalLanguagesLearned,
        'learned_languages_list': learnedLanguagesList,
        'phonology_theory_experience': phonologyTheoryExperience,
        'Email': email,
        '母語 / Native language': nativeLanguage,
        '日本語は第何言語か（300時間以上） / Japanese language order (300+ study hours)': japaneseLanguageOrder,
        '学習経験のある言語数（合計） / Total number of languages learned': totalLanguagesLearned,
        '学習言語リスト（母語含む、学習順） / Learned languages list (including L1, in study order)': learnedLanguagesList,
        '音韻論・音声学（理論）学習経験 / Academic-theoretical phonology/phonetics experience': phonologyTheoryExperience,
        '日本語学習期間（年） / JP learning years': studyYear,
        '日本語学習期間（月） / JP learning months': studyMonth,
        '日本滞在期間（年） / Years lived in Japan': stayYear,
        '日本滞在期間（月） / Months lived in Japan': stayMonth,
        '発音学習経験 / Pronunciation learning experience': pronExperience,
        '受講機関 / Institution': institution,
      };

      let totalTanOn = 0;
      let totalYoOn = 0;
      let totalRT = 0;
      let countRT = 0;

      // ===================== Build Result and RT columns for each stimulus =====================
      stimulusOrder.forEach(stim => {
        const trial = trialMap[stim];
        if (!trial) {
          resultRow[`Result_${stim}`] = '';
          resultRow[`RT_${stim}`] = '';
          return;
        }

            otherText = otherTrial && otherTrial.other_sound ? otherTrial.other_sound : chosenChoice;
            resultStr = `F(他-${otherText})`;
          } else {
            resultStr = `F(${chosenChoice})`;
          }
        }

        resultRow[`RT_${stim}`] = rt;

        }

    { stimulus: 'ぴょ', choices: ['ぴょ (pyo)', 'びょ (byo)', 'みょ (myo)', 'ぽ (po)', '他(other)'], correct_response: 'ぴょ (pyo)' },
    { stimulus: 'びゃ', choices: ['びゃ (bya)', 'りゃ (rya)', 'みゃ (mya)', 'ば (ba)', '他(other)'], correct_response: 'びゃ (bya)' },
    { stimulus: 'びゅ', choices: ['びゅ (byu)', 'ぴゅ (pyu)', 'みゅ (myu)', 'ぶ (bu)', '他(other)'], correct_response: 'びゅ (byu)' },
    { stimulus: 'びょ', choices: ['びょ (byo)', 'ぴょ (pyo)', 'みょ (myo)', 'ぼ (bo)', '他(other)'], correct_response: 'びょ (byo)' },
    { stimulus: 'みゃ', choices: ['みゃ (mya)', 'びゃ (bya)', 'にゃ (nya)', 'ま (ma)', '他(other)'], correct_response: 'みゃ (mya)' },
    { stimulus: 'みゅ', choices: ['みゅ (myu)', 'びゅ (byu)', 'にゅ (nyu)', 'む (mu)', '他(other)'], correct_response: 'みゅ (myu)' },
    { stimulus: 'みょ', choices: ['みょ (myo)', 'びょ (byo)', 'にょ (nyo)', 'も (mo)', '他(other)'], correct_response: 'みょ (myo)' },
    { stimulus: 'りゃ', choices: ['りゃ (rya)', 'びゃ (bya)', 'だ (da)', 'ら (ra)', '他(other)'], correct_response: 'りゃ (rya)' },
    { stimulus: 'りゅ', choices: ['りゅ (ryu)', 'にゅ (nyu)', 'ぎゅ (gyu)', 'る (ru)', '他(other)'], correct_response: 'りゅ (ryu)' },
    { stimulus: 'りょ', choices: ['りょ (ryo)', 'にょ (nyo)', 'ど (do)', 'ろ (ro)', '他(other)'], correct_response: 'りょ (ryo)' }
  ];

  const dummyTrials = [
    { stimulus: 'か', choices: ['か (ka)', 'さ (sa)', 'た (ta)', 'な (na)', '他(other)'], correct_response: 'か (ka)', task: 'dummy_response' },
    { stimulus: 'た', choices: ['か (ka)', 'さ (sa)', 'た (ta)', 'な (na)', '他(other)'], correct_response: 'た (ta)', task: 'dummy_response' }
  ];

  const fixation = {
    type: jsPsychHtmlButtonResponse,
    stimulus: '<div style="font-size: 72px;">+</div>',
    choices: [],
    trial_duration: 500
  };

  // ========================================
  // Trial that plays actual audio from the audio/ folder.
  // ========================================
  const audioTrial = {
    type: jsPsychHtmlKeyboardResponse,
    stimulus: function() {
      const stim = jsPsych.timelineVariable('stimulus');
      const filename = stimulusToRomaji[stim];
      const copy = languageCopy[instructionLanguage];
      const audioText = {
        en: ['Listening task', 'Listen and choose', 'Press once to hear the sound. Answer choices will appear after playback finishes.', 'Press the button to hear the sound', 'If you cannot hear the sound', 'Please check your device settings, switch to Chrome or Firefox, or use a computer.'],
        th: ['การฟังเสียง', 'ฟังแล้วเลือกคำตอบ', 'กดปุ่มหนึ่งครั้งเพื่อฟังเสียง เมื่อเสียงจบแล้วตัวเลือกคำตอบจะปรากฏขึ้น', 'กดปุ่มเพื่อฟังเสียง', 'หากไม่ได้ยินเสียง', 'กรุณาตรวจสอบอุปกรณ์ เปลี่ยนเป็น Chrome หรือ Firefox หรือใช้คอมพิวเตอร์'],
        ja: ['聴取課題', '聞いて選ぶ', 'ボタンを1回押して音声を聞いてください。再生終了後に回答の選択肢が表示されます。', 'ボタンを押して音声を聞いてください', '音声が聞こえない場合', '機器を確認し、ChromeまたはFirefoxに変更するか、パソコンを使用してください。']
      }[instructionLanguage];
      return `
        <div class="audio-task">
          <p class="audio-task-kicker">${audioText[0]}</p>
          <h2 class="audio-task-title">${audioText[1]}</h2>
          <p class="audio-task-instructions">${audioText[2]}</p>
          <button id="play-stimulus" type="button" class="jspsych-btn audio-task-action">
            ${copy.begin === 'เริ่มทำแบบทดสอบ' ? 'เล่นเสียง' : instructionLanguage === 'ja' ? '音声を再生' : 'Play audio'}
          </button>
          <audio id="stim-audio" preload="auto">
            <source src="audio/${filename}.mp3" type="audio/mpeg">
          </audio>
          <p id="audio-status" class="audio-task-status" role="status" aria-live="polite">
            ${audioText[3]}
          </p>
          <div class="audio-task-help">
            <strong>${audioText[4]}</strong><br>
            ${audioText[5]}
          </div>
        </div>
      `;
    },
    choices: "NO_KEYS",
    trial_duration: null,
    on_load: function() {
      const audioEl = document.getElementById('stim-audio');
      const playButton = document.getElementById('play-stimulus');
      const statusEl = document.getElementById('audio-status');
      const stim = jsPsych.timelineVariable('stimulus');
      const isPractice = jsPsych.timelineVariable('task') === 'dummy_response';
      const practiceItems = ['か', 'た'];
      const mainItems = ['し','ち','ひ','に','ぎ','じ','き','り','み','び','ぴ','きゃ','きゅ','きょ','ぎゃ','ぎゅ','ぎょ','しゃ','しゅ','しょ','じゃ','じゅ','じょ','ちゃ','ちゅ','ちょ','にゃ','にゅ','にょ','ひゃ','ひゅ','ひょ','ぴゃ','ぴゅ','ぴょ','びゃ','びゅ','びょ','みゃ','みゅ','みょ','りゃ','りゅ','りょ'];
      const currentItem = (isPractice ? practiceItems : mainItems).indexOf(stim) + 1;
      const progressLabel = isPractice ? languageCopy[instructionLanguage].progressPractice : languageCopy[instructionLanguage].progressQuestion;
      updateStudyProgress(progressLabel, currentItem, isPractice ? 2 : 44);
      let trialFinished = false;

      if (!audioEl || !playButton) {
        return;
      }

      const setStatus = (message, isError = false) => {
        if (statusEl) {
          statusEl.textContent = message;
          statusEl.style.color = isError ? '#ff8b8b' : '#bfd0e7';
        }
      };

      audioEl.onended = function() {
        if (trialFinished) {
          return;
        }
        trialFinished = true;
        jsPsych.finishTrial();
      };

      audioEl.onerror = function() {
        playButton.disabled = false;
        const errorMessage = {
          en: 'Audio could not be loaded. Press the button to try again.',
          th: 'ไม่สามารถโหลดเสียงได้ กรุณากดปุ่มเพื่อลองอีกครั้ง',
          ja: '音声を読み込めません。ボタンを押してもう一度お試しください。'
        }[instructionLanguage];
        setStatus(errorMessage, true);
        console.warn('Audio failed to load:', audioEl.currentSrc, audioEl.error);
      };

      playButton.addEventListener('click', function() {
        if (playButton.disabled || trialFinished) {
          return;
        }

        playButton.disabled = true;
        setStatus({ en: 'Playing...', th: 'กำลังเล่นเสียง...', ja: '再生中…' }[instructionLanguage]);

        const playPromise = audioEl.play();
        if (playPromise && typeof playPromise.catch === 'function') {
          playPromise.catch(function(error) {
            playButton.disabled = false;
            const errorMessage = {
              en: 'Playback was blocked. Press the button to try again.',
              th: 'เบราว์เซอร์บล็อกการเล่นเสียง กรุณากดปุ่มเพื่อลองอีกครั้ง',
              ja: '再生がブロックされました。ボタンを押してもう一度お試しください。'
            }[instructionLanguage];
            setStatus(errorMessage, true);
            console.warn('Audio playback failed:', error);
          });
        }
      });
    }
  };

  const responseTrial = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
      const responseText = {
        en: 'Select the answer that best matches the sound you heard.',
        th: 'เลือกคำตอบที่ตรงกับเสียงที่คุณได้ยินมากที่สุด',
        ja: '聞こえた音に最も近い答えを選択してください。'
      }[instructionLanguage];
      return `<p style="font-size:16px;">${responseText}</p>`;
    },
    choices: jsPsych.timelineVariable('choices'),
    button_html: '<button class="jspsych-btn" style="min-width: 120px; margin: 8px;">%choice%</button>',
    on_load: function() {
      const trialStartTime = performance.now();
      const buttonGroup = document.getElementById('jspsych-html-button-response-btngroup');
      if (!buttonGroup) {
        return;
      }

      buttonGroup.style.display = 'grid';
      buttonGroup.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
      buttonGroup.style.gap = '10px 12px';
      buttonGroup.style.maxWidth = '760px';
      buttonGroup.style.width = '100%';
      buttonGroup.style.margin = '12px auto 0';
      const localizedOther = languageCopy[instructionLanguage].other;

      const otherInlineContainer = document.createElement('div');
      otherInlineContainer.id = 'inline-other-container';
      otherInlineContainer.style.display = 'none';
      otherInlineContainer.style.marginTop = '16px';
      otherInlineContainer.style.padding = '14px';
      otherInlineContainer.style.border = '1px solid rgba(255, 204, 0, 0.38)';
      otherInlineContainer.style.borderRadius = '8px';
      otherInlineContainer.style.background = 'rgba(255, 204, 0, 0.08)';
      otherInlineContainer.style.maxWidth = '760px';
      otherInlineContainer.style.marginLeft = 'auto';
      otherInlineContainer.style.marginRight = 'auto';
      const otherCopy = {
        en: {
          prompt: 'Please enter the sound you heard in romaji.',
          example: 'e.g., di, ti, fi, ri',
          placeholder: 'Enter romaji',
          submit: 'Submit response',
          required: 'Please enter a response before submitting.'
        },
        th: {
          prompt: 'กรุณาพิมพ์เสียงที่ได้ยินเป็นอักษรโรมาจิ',
          example: 'เช่น di, ti, fi, ri',
          placeholder: 'พิมพ์อักษรโรมาจิ',
          submit: 'ส่งคำตอบ',
          required: 'กรุณาพิมพ์คำตอบก่อนส่ง'
        },
        ja: {
          prompt: '聞こえた音をローマ字で入力してください。',
          example: '例：di、ti、fi、ri',
          placeholder: 'ローマ字を入力',
          submit: '回答を送信',
          required: '回答を入力してから送信してください。'
        }
      }[instructionLanguage];
      otherInlineContainer.innerHTML = `
        <div style="margin-bottom: 10px; line-height: 1.6; text-align: left;">
          <strong>${otherCopy.prompt}</strong><br>
          <span style="display:block; margin-top:8px; color:#d9e6ff; font-size:0.95em;">${otherCopy.example}</span>
        </div>
        <input id="inline_other_input" type="text" placeholder="${otherCopy.placeholder}" style="width:100%; max-width:100%;" aria-label="${otherCopy.prompt}" />
        <button type="button" id="inline_other_submit" class="jspsych-btn" style="margin-top:10px; width:100%;">${otherCopy.submit}</button>
        <div id="inline_other_error" style="display:none; margin-top:8px; color:#ff8b8b; text-align:left;">${otherCopy.required}</div>
      `;

      buttonGroup.insertAdjacentElement('afterend', otherInlineContainer);

      const inlineOtherInput = document.getElementById('inline_other_input');
      const inlineOtherSubmit = document.getElementById('inline_other_submit');
      const inlineOtherError = document.getElementById('inline_other_error');

      let inlineOtherChoiceIndex = -1;
      let inlineOtherSubmitted = false;

      Array.from(buttonGroup.children).forEach((choiceWrapper) => {
        const button = choiceWrapper.querySelector('button.jspsych-btn');
        if (!button) {
          return;
        }

        button.classList.add('answer-choice');

        choiceWrapper.style.margin = '0';
        choiceWrapper.style.width = '100%';

        button.style.width = '100%';
        button.style.minWidth = '0';
        button.style.minHeight = '52px';
        button.style.margin = '0';
        button.style.padding = '10px 8px';
        button.style.whiteSpace = 'normal';
        button.style.lineHeight = '1.3';

        if (Array.from(buttonGroup.children).indexOf(choiceWrapper) === buttonGroup.children.length - 1) {
          button.textContent = localizedOther;
          choiceWrapper.style.gridColumn = '1 / -1';
          choiceWrapper.style.marginTop = '10px';
          inlineOtherChoiceIndex = Array.from(buttonGroup.children).indexOf(choiceWrapper);

          button.addEventListener('click', function(event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            event.stopPropagation();

            if (otherInlineContainer.style.display === 'none') {
              otherInlineContainer.style.display = 'block';
            }

            if (inlineOtherError) {
              inlineOtherError.style.display = 'none';
            }

            if (inlineOtherInput) {
              inlineOtherInput.focus();
            }
          }, true);
        }
      });

      if (inlineOtherSubmit) {
        inlineOtherSubmit.addEventListener('click', function() {
          if (inlineOtherSubmitted) {
            return;
          }

          const value = inlineOtherInput ? inlineOtherInput.value.trim() : '';
          if (!value) {
            if (inlineOtherError) {
              inlineOtherError.style.display = 'block';
            }
            if (inlineOtherInput) {
              inlineOtherInput.focus();
            }
            return;
          }

          if (inlineOtherError) {
            inlineOtherError.style.display = 'none';
          }

          inlineOtherSubmitted = true;
          const manualRt = Math.round(performance.now() - trialStartTime);
          jsPsych.finishTrial({
            response: inlineOtherChoiceIndex,
            other_sound: value,
            rt: manualRt
          });
        });
      }
    },
    data: {
      stimulus: jsPsych.timelineVariable('stimulus'),
      correct_response: jsPsych.timelineVariable('correct_response'),
      task: jsPsych.timelineVariable('task')
    },
    on_start: function(trial) {
      if (!trial.data) {
        trial.data = {};
      }
      trial.data.task = trial.data.task || 'response';

      if (trial.choices && Array.isArray(trial.choices)) {
        const choices = trial.choices.slice();
        const otherIndex = choices.findIndex(c => c && c.includes('他'));
        if (otherIndex !== -1) {
          const otherChoice = choices.splice(otherIndex, 1)[0];
          trial.choices = jsPsych.randomization.shuffle(choices).concat([otherChoice]);
        } else {
          trial.choices = jsPsych.randomization.shuffle(choices);
        }
        trial.data.shuffled_choices = trial.choices.slice();
      }
    },
    on_finish: function(data) {
      const choiceIndex = data.response;
      let selectedChoice = null;
      
      if (typeof choiceIndex === 'number' && data.shuffled_choices && data.shuffled_choices[choiceIndex]) {
        selectedChoice = data.shuffled_choices[choiceIndex];
      }
      
      data.chosen_choice = selectedChoice;
      if (selectedChoice && selectedChoice.includes('他')) {
        data.other_sound = String(data.other_sound || '').trim();
      }
      data.correct = selectedChoice === data.correct_response;
    }
  };

  const otherTextTrial = {
    type: jsPsychSurveyText,
    questions: [],
    on_start: function(trial) {
      const copy = {
        en: {
          prompt: 'Please enter the sound you heard in romaji.<br><span style="color:#aaa;">If it differs from the options, enter what you heard (e.g., si, ti, fi).</span>',
          placeholder: 'Enter romaji'
        },
        th: {
          prompt: 'กรุณาพิมพ์เสียงที่ได้ยินเป็นอักษรโรมาจิ<br><span style="color:#aaa;">หากไม่ตรงกับตัวเลือก ให้พิมพ์เสียงที่ได้ยิน เช่น si, ti, fi</span>',
          placeholder: 'พิมพ์อักษรโรมาจิ'
        },
        ja: {
          prompt: '聞こえた音をローマ字で入力してください。<br><span style="color:#aaa;">選択肢と異なる場合は、聞こえた音（si、ti、fiなど）を入力してください。</span>',
          placeholder: 'ローマ字を入力'
        }
      }[instructionLanguage];
      trial.questions = [{
        prompt: `<div style="margin-bottom:15px;"><strong>${copy.prompt}</strong></div>`,
        name: 'other_sound',
        placeholder: copy.placeholder,
        required: true
      }];
    },
    data: {
      task: 'other_text'
    },
    on_finish: function(data) {
      let responses = data.response;
      if (typeof responses === 'string') {
        try {
          responses = JSON.parse(responses);
        } catch (e) {
          responses = {};
        }
      }
      if (typeof responses === 'object' && responses !== null) {
        data.other_sound = responses.other_sound || '';
      } else {
        data.other_sound = '';
      }
    }
  };

  const otherTextTimeline = {
    timeline: [otherTextTrial],
    conditional_function: function() {
      const last = jsPsych.data.get().last(1).values()[0];
      return last.chosen_choice && last.chosen_choice.includes('他') && !String(last.other_sound || '').trim();
    }
  };

  const dummyIntro = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
      const copy = languageCopy[instructionLanguage];
      return `<div class="stage-intro"><p class="audio-task-kicker">${copy.practiceTitle}</p><h2>${copy.practiceTitle}</h2><p>${copy.practiceText}</p></div>`;
    },
    choices: function() { return [instructionLanguage === 'en' ? 'Begin practice' : instructionLanguage === 'th' ? 'เริ่มข้อทดลอง' : '練習を開始']; },
    button_html: '<button class="jspsych-btn" style="min-width: 180px; padding: 10px 20px; font-size: 16px;">%choice%</button>'
  };

  const dummyProcedure = {
    timeline: [fixation, audioTrial, responseTrial, otherTextTimeline],
    timeline_variables: dummyTrials,
    randomize_order: false
  };

  const realStart = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
      const copy = languageCopy[instructionLanguage];
      return `<div class="stage-intro"><p class="audio-task-kicker">${copy.mainTitle}</p><h2>${copy.mainTitle}</h2><p>${copy.mainText}</p></div>`;
    },
    choices: function() { return [instructionLanguage === 'en' ? 'Begin main test' : instructionLanguage === 'th' ? 'เริ่มการทดสอบจริง' : '本番テストを開始']; },
    button_html: '<button class="jspsych-btn" style="min-width: 180px; padding: 10px 20px; font-size: 16px;">%choice%</button>'
  };

  const trialProcedure = {
    timeline: [fixation, audioTrial, responseTrial, otherTextTimeline],
    timeline_variables: trials,
    randomize_order: true
  };
  timeline.push(dummyIntro);
  timeline.push(dummyProcedure);
  timeline.push(realStart);
  timeline.push(trialProcedure);

  const debrief = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
      const messages = {
        en: ['Thank you for participating.', 'Your responses will be submitted when you press the button below. Please wait for the completion page.', 'Please keep the downloaded response file for your records.'],
        th: ['ขอบคุณสำหรับการเข้าร่วม', 'คำตอบของคุณจะถูกส่งเมื่อกดปุ่มด้านล่าง กรุณารอจนกว่าหน้าสำเร็จจะแสดงขึ้น', 'กรุณาเก็บไฟล์คำตอบที่ดาวน์โหลดไว้เป็นหลักฐาน'],
        ja: ['ご協力ありがとうございました。', '下のボタンを押すと回答が送信されます。完了画面が表示されるまでお待ちください。', 'ダウンロードした回答ファイルを保管してください。']
      }[instructionLanguage];
      return `<div style="max-width:760px; margin:0 auto; text-align:center;"><h2>${messages[0]}</h2><div style="margin-top:24px; padding:20px; background:#1a1a1a; border:1px solid #ffcc00; border-radius:8px; line-height:1.8; text-align:center;"><p style="color:#ffda72; margin:0 0 10px;"><strong>${instructionLanguage === 'en' ? 'Note' : instructionLanguage === 'th' ? 'หมายเหตุ' : '備考'}</strong></p><p style="margin:0 0 8px;">${messages[1]}</p><p style="margin:0; color:#d5e1f1;">${messages[2]}<br>u548378a@ecs.osaka-u.ac.jp</p></div></div>`;
    },
    choices: function() { return [languageCopy[instructionLanguage].submit]; },
    button_html: '<button class="jspsych-btn" style="min-width: 180px; padding: 10px 20px; font-size: 16px;">%choice%</button>',
    on_load: function() {
      hideStudyProgress();
    }
  };
  timeline.push(debrief);

  jsPsych.run(timeline);
</script>
</html>
