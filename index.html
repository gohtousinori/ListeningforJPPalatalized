<script>
  // ========================================
  // Mapping: stimulus (kana) -> audio filename (romaji, no extension)
  // ========================================
  const stimulusToRomaji = {
    'し':'shi', 'ち':'chi', 'ひ':'hi', 'に':'ni', 'ぎ':'gi', 'じ':'ji', 'き':'ki', 'り':'ri', 'み':'mi', 'び':'bi', 'ぴ':'pi',
    'きゃ':'kya', 'きゅ':'kyu', 'きょ':'kyo',
    'ぎゃ':'gya', 'ぎゅ':'gyu', 'ぎょ':'gyo',
    'しゃ':'sha', 'しゅ':'shu', 'しょ':'sho',
    'じゃ':'ja', 'じゅ':'ju', 'じょ':'jo',
    'ちゃ':'cha', 'ちゅ':'chu', 'ちょ':'cho',
    'にゃ':'nya', 'にゅ':'nyu', 'にょ':'nyo',
    'ひゃ':'hya', 'ひゅ':'hyu', 'ひょ':'hyo',
    'ぴゃ':'pya', 'ぴゅ':'pyu', 'ぴょ':'pyo',
    'びゃ':'bya', 'びゅ':'byu', 'びょ':'byo',
    'みゃ':'mya', 'みゅ':'myu', 'みょ':'myo',
    'りゃ':'rya', 'りゅ':'ryu', 'りょ':'ryo',
    'か':'ka', 'た':'ta'
  };

  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwYHlkCLsRIJifCDTMFdmLwXyz9PC31ReUz-RxWbasI3ywEVrn_LF9AKzWx-5bp6sXi0Q/exec';
  const SHEET_ID = '1QNbIit_mmA-hdWUTdMOK7j_7JMsjWXnWGNrH9amUNF8';
  const PENDING_SUBMISSIONS_KEY = 'palatalizedsoundtest_pending_submissions';

  function createSubmissionId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }

    return 'submission-' + Date.now() + '-' + Math.random().toString(16).slice(2);
  }

  function readPendingSubmissions() {
    try {
      const raw = localStorage.getItem(PENDING_SUBMISSIONS_KEY);
      if (!raw) return [];

      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (error) {
      console.error('Unable to read pending submissions:', error);
      return [];
    }
  }

  function writePendingSubmissions(items) {
    try {
      localStorage.setItem(PENDING_SUBMISSIONS_KEY, JSON.stringify(items));
    } catch (error) {
      console.error('Unable to persist pending submissions:', error);
    }
  }

  function queueSubmission(payload) {
    const items = readPendingSubmissions();
    const existingIndex = items.findIndex(item => item.submissionId === payload.submission_id);
    const entry = {
      submissionId: payload.submission_id,
      payload,
      queuedAt: new Date().toISOString(),
      attempts: existingIndex >= 0 ? items[existingIndex].attempts || 0 : 0,
      lastError: existingIndex >= 0 ? items[existingIndex].lastError || '' : ''
    };

    if (existingIndex >= 0) {
      items[existingIndex] = entry;
    } else {
      items.push(entry);
    }

    writePendingSubmissions(items);
  }

  function updateQueuedSubmission(submissionId, updates) {
    const items = readPendingSubmissions();
    const index = items.findIndex(item => item.submissionId === submissionId);
    if (index === -1) return;

    items[index] = {
      ...items[index],
      ...updates
    };
    writePendingSubmissions(items);
  }

  function removeQueuedSubmission(submissionId) {
    const items = readPendingSubmissions().filter(item => item.submissionId !== submissionId);
    writePendingSubmissions(items);
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function postSubmission(payload) {
    const response = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload),
      keepalive: true
    });

    const responseText = await response.text();
    let result = null;

    if (responseText) {
      try {
        result = JSON.parse(responseText);
      } catch (parseError) {
        // Some mobile browsers cannot read cross-origin JSON body reliably.
        // If HTTP status is success, treat this as delivered and continue.
        if (!response.ok) {
          throw new Error(`HTTP ${response.status} ${response.statusText} | Invalid response body: ${responseText}`);
        }

        result = {
          success: true,
          fallback: 'non_json_success_response'
        };
      }
    }

    if (!response.ok) {
      throw new Error(`HTTP ${response.status} ${response.statusText} | ${(result && result.error) || responseText || 'Request failed'}`);
    }

    if (result && result.success === false) {
      throw new Error(result.error || 'Google Apps Script returned success=false');
    }

    if (!result) {
      result = { success: true, fallback: 'empty_success_response' };
    }

    return { response, result, responseText };
  }

  async function postSubmissionFallback(payload) {
    const bodyText = JSON.stringify(payload);

    if (navigator.sendBeacon) {
      const beaconBody = new Blob([bodyText], { type: 'text/plain;charset=utf-8' });
      const accepted = navigator.sendBeacon(GOOGLE_SCRIPT_URL, beaconBody);
      if (accepted) {
        return {
          response: { status: 0, statusText: 'sendBeacon accepted' },
          result: { success: true, fallback: 'sendBeacon' },
          responseText: ''
        };
      }
    }

    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: bodyText,
      keepalive: true
    });

    return {
      response: { status: 0, statusText: 'no-cors' },
      result: { success: true, fallback: 'no-cors' },
      responseText: ''
    };
  }

  async function submitWithRetry(payload, maxAttempts, retryDelayMs) {
    let attempt = 0;
    let lastError = null;

    while (attempt < maxAttempts) {
      attempt += 1;
      updateQueuedSubmission(payload.submission_id, {
        attempts: attempt,
        lastError: ''
      });

      try {
        return await postSubmission(payload);
      } catch (error) {
        lastError = error;

        const isLastAttempt = attempt >= maxAttempts;
        const isFetchNetworkError = error && error.message && error.message.toLowerCase().indexOf('failed to fetch') !== -1;

        if (isLastAttempt && isFetchNetworkError) {
          try {
            const fallbackResult = await postSubmissionFallback(payload);
            updateQueuedSubmission(payload.submission_id, {
              attempts: attempt,
              lastError: '',
              lastAttemptAt: new Date().toISOString(),
              fallbackUsed: fallbackResult.result.fallback
            });
            return fallbackResult;
          } catch (fallbackError) {
            lastError = fallbackError;
          }
        }

        updateQueuedSubmission(payload.submission_id, {
          attempts: attempt,
          lastError: (lastError && lastError.message) ? lastError.message : String(lastError || error),
          lastAttemptAt: new Date().toISOString()
        });

        if (attempt < maxAttempts) {
          await delay(retryDelayMs);
        }
      }
    }

    throw lastError || new Error('Submission failed');
  }

  async function flushPendingSubmissions() {
    const pending = readPendingSubmissions();
    if (pending.length === 0) return;

    for (const entry of pending) {
      try {
        const result = await submitWithRetry(entry.payload, 2, 1500);
        console.log('Retried pending submission successfully:', {
          submissionId: entry.submissionId,
          status: result.response.status,
          result: result.result
        });
        removeQueuedSubmission(entry.submissionId);
      } catch (error) {
        console.error('Pending submission still failing:', entry.submissionId, error);
      }
    }
  }

  flushPendingSubmissions();

  // ========================================
  // Step 1: Initialize jsPsych and configure result submission to Google Sheets.
  // ========================================
  const jsPsych = initJsPsych({
    on_finish: function() {
      const allData = jsPsych.data.get().values();
      const responseRows = allData.filter(r => r.task === 'response');
      
      // ===================== Fixed 44-item stimulus order =====================
      const stimulusOrder = [
        'し','ち','ひ','に','ぎ','じ','き','り','み','び','ぴ',
        'きゃ','きゅ','きょ','ぎゃ','ぎゅ','ぎょ',
        'しゃ','しゅ','しょ','じゃ','じゅ','じょ',
        'ちゃ','ちゅ','ちょ','にゃ','にゅ','にょ',
        'ひゃ','ひゅ','ひょ','ぴゃ','ぴゅ','ぴょ',
        'びゃ','びゅ','びょ','みゃ','みゅ','みょ',
        'りゃ','りゅ','りょ'
      ];
      
      const tanOnList = ['し','ち','ひ','に','ぎ','じ','き','り','み','び','ぴ'];
      
      // ===================== Collect base participant data =====================
      const preFormData = allData.find(r => r.task === 'pre_survey_form') || {};
      const studyYear = preFormData.study_year || '';
      const studyMonth = preFormData.study_month || '';
      const stayYear = preFormData.stay_year || '';
      const stayMonth = preFormData.stay_month || '';
      const nativeLanguage = preFormData.native_language || '';
      const email = preFormData.email || '';
      
      const preChoiceData = allData.find(r => r.task === 'pre_survey_choice') || {};
      let pronExperience = '';
      if (preChoiceData.response) {
        let resp = preChoiceData.response;
        if (typeof resp === 'string') {
          try { resp = JSON.parse(resp); } catch(e) {}
        }
        if (Array.isArray(resp)) {
          pronExperience = resp[0] || '';
        } else if (resp && typeof resp === 'object') {
          pronExperience = Object.values(resp)[0] || '';
        } else {
          pronExperience = resp;
        }
      }
      
      const preInstData = allData.find(r => r.task === 'pre_survey_institution') || {};
      let institution = '';
      if (preInstData.response) {
        let resp = preInstData.response;
        if (typeof resp === 'string') {
          try { resp = JSON.parse(resp); } catch(e) {}
        }
        if (resp && typeof resp === 'object') {
          institution = resp.institution || '';
        } else {
          institution = resp || '';
        }
      }

      // ===================== Build map for stimulus -> trial data =====================
      const trialMap = {};
      responseRows.forEach(d => {
        trialMap[d.stimulus] = d;
      });

      // ===================== Build result row (one row per participant) =====================
      const resultRow = {
        'Email': email,
        '母語 / Native language': nativeLanguage,
        '日本語学習期間（年） / JP learning years': studyYear,
        '日本語学習期間（月） / JP learning months': studyMonth,
        '日本滞在期間（年） / Years lived in Japan': stayYear,
        '日本滞在期間（月） / Months lived in Japan': stayMonth,
        '発音学習経験 / Pronunciation learning experience': pronExperience,
        '受講機関 / Institution': institution,
      };

      let totalTanOn = 0;
      let totalYoOn = 0;
      let totalRT = 0;
      let countRT = 0;

      // ===================== Build Result and RT columns for each stimulus =====================
      stimulusOrder.forEach(stim => {
        const trial = trialMap[stim];
        if (!trial) {
          resultRow[`Result_${stim}`] = '';
          resultRow[`RT_${stim}`] = '';
          return;
        }

        const correct = trial.correct === true || trial.correct === 'true';
        const chosenChoice = trial.chosen_choice || '';
        const rt = trial.rt || 0;

        let resultStr;
        if (correct) {
          resultStr = 'T';
          if (tanOnList.includes(stim)) totalTanOn++;
          else totalYoOn++;
        } else {
          // If incorrect, pull "other_sound" from a nearby other_text trial.
          let otherText = '';
          if (chosenChoice && chosenChoice.includes('他')) {
            const otherTrial = allData.find(d =>
              d.task === 'other_text' &&
              Math.abs((d.time_elapsed || 0) - (trial.time_elapsed || 0)) < 15000
            );
            otherText = otherTrial && otherTrial.other_sound ? otherTrial.other_sound : chosenChoice;
            resultStr = `F(他-${otherText})`;
          } else {
            resultStr = `F(${chosenChoice})`;
          }
        }

        resultRow[`Result_${stim}`] = resultStr;
        resultRow[`RT_${stim}`] = rt;

        if (rt > 0) {
          totalRT += rt;
          countRT++;
        }
      });

      // ===================== Add total score summary =====================
      resultRow['Total Tan-on Score'] = totalTanOn;
      resultRow['Total Yo-on Score'] = totalYoOn;
      resultRow['Average Response Time (ms)'] = countRT > 0 ? Math.round(totalRT / countRT) : 0;

      // ===================== Download CSV =====================
      const headers = Object.keys(resultRow);
      const csvRows = [
        headers.map(h => `"${h}"`).join(','),
        headers.map(h => {
          const value = resultRow[h];
          return `"${value !== null && value !== undefined ? String(value).replace(/"/g, '""') : ''}"`;
        }).join(',')
      ];
      const csvContent = '\uFEFF' + csvRows.join('\n');

      const downloadCsv = () => {
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.setAttribute('href', url);
        link.setAttribute('download', 'ResultPattern.csv');
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };

      // ===================== Show summary text =====================
      const tanOnCorrect = responseRows.filter(r => tanOnList.includes(r.stimulus) && (r.correct === true || r.correct === 'true')).length;
      const yoOnCorrect = responseRows.filter(r => !tanOnList.includes(r.stimulus) && (r.correct === true || r.correct === 'true')).length;
      
      const displayText = `
    ════════════════════════════════════════════════════════
               テスト結果 / Test Results
    ════════════════════════════════════════════════════════

    【基本情報 / Basic Information】
    - Email: ${email}
    - 母語 / Native language: ${nativeLanguage}
    - 日本語学習（年）: ${studyYear}
    - 日本語学習（月）: ${studyMonth}
    - 日本滞在（年）: ${stayYear}
    - 日本滞在（月）: ${stayMonth}
    - 発音学習経験: ${pronExperience}
    - 受講機関: ${institution}

    【集計 / Summary】
    - Tan-on (単音) correct: ${tanOnCorrect}/11
    - Yo-on (拗音) correct: ${yoOnCorrect}/33
    - Total correct: ${tanOnCorrect + yoOnCorrect}/44

    ════════════════════════════════════════════════════════
      Sending to Google Sheets and downloading CSV...
    ════════════════════════════════════════════════════════
    `;
      
      console.log(displayText);

      // ===================== Send data to Google Apps Script =====================
      const submissionId = createSubmissionId();

      // Build detailed rows for Google Sheets.
      const detailedRows = [];
      stimulusOrder.forEach((stim, index) => {
        const trial = trialMap[stim];
        if (trial) {
          detailedRows.push({
            native_language: nativeLanguage,
            submission_id: submissionId,
            Email: email,
            stimulus_order: index + 1,
            stimulus: stim,
            correct_response: trial.correct_response,
            response: trial.chosen_choice || 'n/a',
            is_correct: trial.correct === true || trial.correct === 'true' ? 'TRUE' : 'FALSE',
            reaction_time_ms: trial.rt || 'n/a'
          });
        }
      });

      resultRow['submission_id'] = submissionId;
      resultRow['submitted_at'] = new Date().toISOString();

      const payload = {
        submission_id: submissionId,
        native_language: nativeLanguage,
        respondent_data: resultRow,
        detailed_results: detailedRows,
        sheetId: SHEET_ID
      };

      queueSubmission(payload);

      submitWithRetry(payload, 3, 2000)
      .then(({ response, result, responseText }) => {
        console.log('Google Sheets response:', {
          status: response.status,
          result,
          responseText
        });

        removeQueuedSubmission(submissionId);
        downloadCsv();

        if (result.success && !result.fallback) {
          alert('✓ Your responses have been submitted to Google Sheets successfully.\n\nHTTP Status: ' + response.status + '\n\nResultPattern.csv has also been downloaded to your Downloads folder.');
        } else if (result.success && result.fallback) {
          alert('✓ Your responses were sent using fallback mode (' + result.fallback + ').\n\nThis browser may restrict direct access to the response body; however, the data has been transmitted from your device.\n\nPlease verify the entry in Google Sheets after 10-30 seconds.\n\nCSV download completed.');
        } else {
          alert('⚠️ An error occurred while submitting data to Google Sheets.\n\nHTTP Status: ' + response.status + '\nDetails: ' + (result.error || responseText || 'Unknown error') + '\n\nCSV download completed.');
        }
      })
      .catch(error => {
        console.error('Error sending to Google Sheets:', error);
        downloadCsv();
        alert('⚠️ Submission to Google Sheets failed.\n\nDetails: ' + error.message + '\n\nYour data has been stored locally on this device and will be retried automatically the next time this page is opened.\n\nCSV download completed.');
      });
    }
  });

  // ========================================
  // Build timeline array for all experiment steps.
  // ========================================
  const timeline = [];

  // ========================================
  // Step 2: Start page - research title and privacy notice.
  // ========================================
  const titleAndNotice = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div style="text-align: center; padding: 30px 20px;">
        <h1 style="font-size: 18px; line-height: 1.8; margin: 0 0 20px 0;">
          日本語学習者におけるイ段音（単音／拗音）<br>の口蓋化子音の聴取困難<br>
          <span style="font-size: 16px; font-weight: normal;">— 大規模横断調査による要因分析と教育への示唆 —</span><br>
          <span style="font-size: 14px; font-weight: normal; color: #aaa; margin-top: 10px; display: block;">Perceptual difficulty of palatalized consonants in i-row sounds (monophthong / contracted forms)<br>among learners of Japanese<br>— Factor analysis based on a large-scale cross-sectional study and pedagogical implications —</span>
        </h1>
        
        <div style="background: #333; color: #fff; padding: 20px; border: 1px solid #666; border-radius: 5px; text-align: center; font-size: 14px; line-height: 1.6; margin-top: 20px;">
          <strong>重要な注記 / Important Notice:</strong><br>
          本調査は研究目的でのデータ収集のみを目的としています。ご提供いただいたデータは機密として保管され、個人を特定できる情報を含まない概要形式で提示されます。<br>
          研究への参加は自由意思で決定でき、途中で中断・撤回できること、中断・撤回してもなんら不利益を被りません。<br>
          ご提供いただいたデータは本研究に使用され、学会で発表されます。<br>
          <br>
          This study is conducted exclusively for research purposes. All data you provide will be handled confidentially and reported only in aggregated form, without personally identifying information.<br>
          Participation is entirely voluntary. You may discontinue or withdraw at any time without any disadvantage.<br>
          The data collected in this study may be used for scholarly analysis and presented at academic conferences.<br>
          <br>
          <strong>ご質問やお問い合わせ / Contact:</strong><br>
          (+81)070-9192-6459 / u548378a@ecs.osaka-u.ac.jp<br>
          ケハナン アカラポン (Akarapong Kehanan)<br>
          大阪大学大学院 人文学研究科 博士後期課程
        </div>
      </div>
    `,
    choices: ['同意する / I consent', '同意しません / I do not consent'],
    button_html: '<button class="jspsych-btn" style="min-width: 150px; margin: 12px;">%choice%</button>',
    data: { task: 'title_and_notice' },
    on_finish: function(data) {
      data.consent = data.response === 0;
    }
  };

  // ========================================
  // Screen shown when the participant does not consent.
  // ========================================
  const consentRefusal = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div style="text-align: center; padding: 30px 20px;">
        <h1 style="font-size: 24px; margin: 0 0 20px 0; color: #ff6b6b;">
          申し訳ございません / Sorry
        </h1>
        <div style="background: #333; color: #fff; padding: 20px; border: 1px solid #ff6b6b; border-radius: 5px; text-align: center; font-size: 14px; line-height: 1.8; margin-top: 20px;">
          <p style="margin: 10px 0;">
            <strong>同意していただけなかったため、本調査は終了いたします。</strong><br>
            ご協力いただき、ありがとうございました。
          </p>
          <p style="margin: 10px 0;">
            <strong>As consent was not provided, this survey will now be terminated.</strong><br>
            Thank you for your time and consideration.
          </p>
        </div>
      </div>
    `,
    choices: ['了解 / Close'],
    button_html: '<button class="jspsych-btn" style="min-width: 150px; padding: 10px 20px; font-size: 16px;">%choice%</button>'
  };

  // ========================================
  // Step 3: Survey on pronunciation-learning experience.
  // ========================================
  const preSurveyChoice = {
    type: jsPsychSurveyMultiChoice,
    questions: [
      {
        prompt: '発音学習の経験はありますか。\n<div style="margin-top:6px;color:#ccc;font-size:0.9em">Have you received formal instruction in pronunciation? (Yes/No)</div>',
        name: 'pron_experience',
        options: ['無', '有'],
        required: true
      }
    ],
    data: { task: 'pre_survey_choice' }
  };

  // ========================================
  // Step 4: Pre-survey section 1.
  // ========================================
  const preSurveyForm = {
    type: jsPsychHtmlButtonResponse,
    stimulus: function() {
      let yearOptions = '<option value="">Select / 選択してください</option>';
      for (let i = 0; i <= 50; i++) { yearOptions += `<option value="${i}">${i} years / ${i} 年</option>`; }
      let monthOptions = '<option value="">Select / 選択してください</option>';
      for (let m = 0; m <= 12; m++) { monthOptions += `<option value="${m}">${m} months / ${m} ヶ月</option>`; }
      monthOptions += '<option value="3">Not sure (about 0-6 months) / 不確定(約0-6か月)</option>';
      monthOptions += '<option value="9">Not sure (about 6-12 months) / 不確定(約6-12か月)</option>';
      const nativeLanguageOptions = [
        'Thai',
        'Japanese',
        'Korean',
        'Chinese (Mandarin)',
        'Chinese (Cantonese)',
        'Vietnamese',
        'English (US)',
        'English (UK)',
        'French',
        'German',
        'Italian',
        'Spanish',
        'Arabic',
        'Russian',
        'Portuguese',
        'Indonesian',
        'Malay',
        'Hindi',
        'Bengali',
        'Turkish',
        'Persian (Farsi)',
        'Ukrainian',
        'Other'
      ];
      let nativeLanguageSelect = '<option value="">Select / 選択してください</option>';
      nativeLanguageOptions.forEach(lang => {
        nativeLanguageSelect += `<option value="${lang}">${lang}</option>`;
      });

      return `
        <div style="color:#fff">
